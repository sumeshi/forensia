name: Release

# Publishes forensia to PyPI when a GitHub Release is published.
# Pure Python distribution: no frontend build or bundled web assets.
# Uses PyPI Trusted Publishing (OIDC) — no API token secret is required;
# configure the trusted publisher on PyPI once (project "forensia",
# workflow "release.yml", environment "pypi").

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # On a published release, fail fast if the tag does not match the version
      # declared in pyproject.toml, so we never upload a mismatched artifact.
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match pyproject version '$version'"
            exit 1
          fi

      # --- Quality gate, then build sdist + wheel ---
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync dependencies (Python 3.14 + dev group)
        run: uv sync --dev
      - name: Quality gate
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run pytest tests/ -q
          uv run python scripts/check_imports.py
          uv run python scripts/audit_schema_coverage.py --strict
          uv run python scripts/regenerate_playbook.py --check
          uv run forensia doctor
      - name: Build sdist + wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
