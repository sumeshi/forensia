name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies (installs Python 3.14 + dev group)
        run: uv sync --dev

      - name: Ruff lint (F, I, UP)
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Full offline test suite
        run: uv run pytest tests/ -q

      - name: Import boundaries
        run: uv run python scripts/check_imports.py

      - name: Declarative schema coverage
        run: uv run python scripts/audit_schema_coverage.py --strict

      - name: Generated playbook drift
        run: uv run python scripts/regenerate_playbook.py --check

      - name: Installed package health
        run: uv run forensia doctor
