id: "registry-userassist-temporary-path-execution"
title: "UserAssist execution record references a temporary path"
severity: medium
confidence: 0.55
required_fields:
- key_path
- ua_name
tags:
- registry
- userassist
- execution
query: "SELECT\n    artifact_id AS evidence_id,\n    key_path,\n    hive,\n    timestamp,\n    json_extract_string(raw_json, '$.reg2es.custom.userassist.name') AS ua_name\nFROM registry_artifacts\nWHERE plugin = 'userassist'\n    AND LOWER(COALESCE(json_extract_string(raw_json, '$.reg2es.custom.userassist.name'), '')) LIKE '%\\temp\\%'\n"
finding:
  title: "UserAssist path reference: {ua_name}"
  summary: "UserAssist records program name {ua_name} under {key_path}. The path includes a temporary-directory string; this record does not establish that the program was malicious."
