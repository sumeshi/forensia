id: "prefetch-dll-path-reference"
title: "Prefetch record references a DLL under a user path"
severity: medium
confidence: 0.5
required_fields:
- executable_name
- last_exec_time
tags:
- prefetch
- execution
- file-reference
query: "SELECT\n    evidence_id,\n    executable_name,\n    exec_count,\n    last_exec_time,\n    filenames\nFROM prefetch_executions\nWHERE filenames IS NOT NULL\n    AND LOWER(CAST(filenames AS VARCHAR)) LIKE '%.dll%'\n    AND (\n        LOWER(CAST(filenames AS VARCHAR)) LIKE '%\\temp\\%'\n        OR LOWER(CAST(filenames AS VARCHAR)) LIKE '%\\appdata\\%'\n        OR LOWER(CAST(filenames AS VARCHAR)) LIKE '%\\programdata\\%'\n        OR LOWER(CAST(filenames AS VARCHAR)) LIKE '%\\users\\%'\n    )\nORDER BY last_exec_time DESC\n"
finding:
  title: "DLL path referenced by Prefetch: {executable_name}"
  summary: "The Prefetch files list for {executable_name} includes a DLL path under a commonly user-writable location (last run: {last_exec_time}). A file reference does not by itself establish that the DLL was loaded or sideloaded."
