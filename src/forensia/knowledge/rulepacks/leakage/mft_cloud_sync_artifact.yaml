id: leakage-mft-cloud-sync-artifact
title: Cloud sync client artifact observed
severity: medium
confidence: 0.6
required_fields:
- file_path
query: "SELECT\n    evidence_id,\n    file_name,\n    file_path,\n    si_created,\n    si_modified\nFROM mft_entries\nWHERE\n    LOWER(file_path) LIKE '%googledrivesync%' OR\n    LOWER(file_path) LIKE '%/google drive/%' OR\n    LOWER(file_path) LIKE '%/onedrive/%' OR\n    LOWER(file_path) LIKE '%/icloud%' OR\n    LOWER(file_path) LIKE '%dropbox%'\n"
finding:
  title: 'Cloud sync artifact observed: {file_name}'
  summary: A cloud sync-related artifact was observed at {file_path}. This may indicate data synchronization capability or use of consumer cloud storage and should be correlated with recent file activity and user logon context.
tags:
- leakage
- cloud-sync
- insider-threat
attack:
- tactic: exfiltration
  technique_id: T1567.002
  technique_name: 'Exfiltration Over Web Service: Exfiltration to Cloud Storage'
