# verdict_taxonomy.yaml
# Central vocabulary for all verdict/status enums across investigation phases.
# Every string value used as verdict/status/stage must appear here.

hypothesis_verdict:
  values:
    - confirmed
    - refuted
    - inconclusive
    - newlead
    - untestable
  description: "Verdict for a hypothesis after query+check phase"

section_verdict:
  values:
    - block_supported
    - block_needs_more
    - block_contradicted
  description: "Verdict from section agent check phase"

structured_status:
  values:
    - answered
    - partial
    - candidate_only
    - not_found
    - not_searched
    - insufficient_evidence
    - wrong_query
    - unobservable
    - error
  description: "Status for individual semantic/structured question answers"

question_status:
  values:
    - answered
    - partial
    - candidate_only
    - not_found
    - not_searched
    - insufficient_evidence
    - wrong_query
    - unobservable
    - error
  description: "Backward-compatible alias for structured_status"

claim_status:
  values:
    - accepted
    - suppressed
    - pending
  description: "Support status for evidence-backed claims in memory"

# Canonical hypothesis lifecycle taxonomy (single source of truth for
# /api/hypotheses, /api/stats, snapshot counts, and the Web UI KPI/breakdown).
# Every value actually stored in hypotheses.status must appear here. The
# `groups` block is the authoritative active/resolved partition used by both
# the backend (service.py) and the frontend (cockpit.ts) so DB, API, snapshot,
# and UI reconcile to the same revision.
hypothesis_status:
  values:
    - active
    - confirmed
    - refuted
    - untestable
    - needs_review
    - deferred
    - blocked
  description: "Lifecycle status of a hypothesis."
  groups:
    active: [active]
    resolved: [confirmed, refuted, untestable, needs_review, deferred, blocked]
  kpi:
    resolved_total_field: resolved_hypotheses
    breakdown_fields:
      - confirmed_hypotheses
      - refuted_hypotheses
      - untestable_hypotheses
      - needs_review_hypotheses
      - deferred_hypotheses
      - blocked_hypotheses

# Report section completion taxonomy. `ai_exhausted` is the stable/auto-filled
# state; `human_reviewed` is the human-approved state. The human-review
# percentage is computed from `reviewed / (draft + stable + reviewed)`.
report_section_status:
  values:
    - draft
    - ai_exhausted
    - human_reviewed
  description: "Completion state of a report section."
  groups:
    draft: [draft]
    stable: [ai_exhausted]
    reviewed: [human_reviewed]
