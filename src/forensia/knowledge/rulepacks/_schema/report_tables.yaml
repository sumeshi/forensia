# Captions for `mode: table` report blocks, keyed by builder name
# (see _TABLE_BLOCK_BUILDERS in forensia/report/probes.py).
#
# `caption` renders as one short paragraph between the block heading and the
# table. `empty` replaces the table entirely when the builder returns no rows.
# Placeholder grammar is shared with question_routing.yaml
# interpretation_template: {row_count}, {first.col}, {last.col}, {sample(col, n)}.
tables:
  overview_evidence_scope:
    caption: "List of ingested evidence source counts and coverage ({row_count} metrics). Sources with zero rows indicate not ingested or not detected."
    empty: "No ingested evidence sources. Check the ingestion results."
    max_rows: 50
  overview_systems_observed:
    caption: "{row_count} hosts observed ({sample(host, 3)}). Row counts and first/last seen timestamps show each host's activity period."
    empty: "No hosts could be identified from EVTX."
    max_rows: 0
  overview_key_findings:
    caption: "{row_count} key findings ranked by severity. Top: \"{first.finding}\". Check confidence and rationale in the body and appendix."
    empty: "No high-confidence findings have been extracted yet."
    max_rows: 0
  timeline_phase_summary:
    caption: "Daily activity phase summary ({row_count} days, {first.date} to {last.date}). The Interpretation column shows machine-determined priority review points."
    empty: "No events available to construct a phase summary."
    max_rows: 0
  timeline_chronological:
    caption: "Chronological list of {row_count} notable events ({first.time} to {last.time}). Authentication, log manipulation, and notable app executions are ordered by time."
    empty: "No notable events have been extracted for the timeline."
    max_rows: 0
  technical_accounts:
    caption: "Authentication activity summary by account ({row_count} rows). Key accounts: {sample(account, 3)}. 4624=successful logon, 4625=failed, 4648=explicit credential usage."
    empty: "Account aggregation could not be constructed from authentication events."
    max_rows: 50
  technical_execution:
    caption: "{row_count} notable executed files (cleaning tools and user apps prioritized). Representatives: {sample(executable_name, 3)}."
    empty: "No notable execution history was found from Prefetch."
    max_rows: 30
  technical_files:
    caption: "{row_count} user-related file artifacts (sorted by most recent update). Representatives: {sample(file_name, 3)}."
    empty: "No notable user file artifacts have been extracted."
    max_rows: 30
  technical_antiforensic:
    caption: "{row_count} anti-forensic candidates (log clearing events, tool executions, related artifacts). Do not conclude from single items; evaluate with surrounding operations."
    empty: "No anti-forensic traces have been detected."
    max_rows: 0
  technical_network:
    caption: "Summary of normalized network traces. If external source/destination row counts are 0, external communication evidence has not been normalized in this dataset."
    empty: "Network traces have not been normalized."
    max_rows: 0
  gaps_unresolved:
    caption: "{row_count} unresolved hypotheses. Latest rationale and Needed evidence guide re-investigation priority."
    empty: "No unresolved hypotheses."
    max_rows: 0
  gaps_untestable:
    caption: "{row_count} hypotheses deemed untestable with the current dataset. Acquiring missing telemetry is the condition for resuming verification."
    empty: "No hypotheses were deemed untestable."
    max_rows: 0
  gaps_evidence:
    caption: "{row_count} evidence gaps that may affect conclusions."
    empty: "No recorded evidence gaps."
    max_rows: 0
  recommendations_action_plan:
    caption: "{row_count} recommended actions ranked by priority. The Evidence/Gap column corresponds to the finding or gap that supports the action."
    empty: "No findings or gaps available to derive recommended actions."
    max_rows: 0
