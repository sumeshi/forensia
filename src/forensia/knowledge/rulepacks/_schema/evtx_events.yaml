table: evtx_events
# 'core_columns' is what the planner LLM sees in the prompt — kept short on purpose.
# 'columns' is the full set used by the SQL validator (allows derived columns).
core_columns:
  - event_id
  - timestamp
  - computer
  - channel
  - user_name
  - target_user
  - subject_user
  - src_ip
  - logon_type
  - process_name
  - command_line
  - service_name
  - raw_json
column_descriptions:
  event_id: "Windows event ID (int). Primary filter."
  timestamp: "Event time (TIMESTAMP). Use BETWEEN for range queries."
  computer: "Hostname where the event was recorded."
  channel: "Log channel: 'Security', 'System', 'Application', 'Microsoft-Windows-PowerShell/Operational', etc."
  user_name: "Generic account name. NULL for many events — fall back to subject_user/target_user."
  target_user: "Account the action targets (for 4624/4720 etc)."
  subject_user: "Account that triggered the action (for 4732/4648 etc)."
  src_ip: "Source IP for network logon (event 4624 logon_type 3/10)."
  logon_type: "Stored as string. '2' interactive, '3' network, '10' RDP."
  process_name: "Executable of the actor process (4688)."
  command_line: "Full command line (4688)."
  service_name: "Service display name (7045)."
  raw_json: "Raw event payload as JSON string. Use json_extract_string(raw_json, '$.Field') when a column is NULL."
columns:
  - evidence_id
  - source_file
  - channel
  - event_id
  - record_id
  - timestamp
  - computer
  - user_name
  - target_user
  - subject_user
  - src_ip
  - dst_ip
  - dst_port
  - protocol
  - logon_type
  - process_name
  - process_id
  - command_line
  - service_name
  - exception_code
  - object_dn
  - attribute
  - target_server
  - target_group
  - task_name
  - session_id
  - share_name
  - access_mask
  - normalized_src_ip
  - normalized_target_user
  - parent_process
  - parent_process_id
  - parent_cmd
  - child_process
  - child_process_id
  - child_cmd
  - parent_image
  - file_path
  - parent_guid
  - child_guid
  - clear_time
  - clear_event_id
  - first_seen
  - last_seen
  - hour_bucket
  - request_count
  - status
  - reason
  - message
  - raw_json
  - tags
  - severity
notes:
  interactive_logon: "To identify the last logged-on user, query event_id = 4624 AND logon_type IN ('2','10'). Treat 4728/4732 and similar group-management events as account administration, NOT logon evidence."
  entity_normalization: "Treat account names ending with '$' as machine_account, not as user or source_ip. Keep source_ip, source_host, and source_account separate; never store a machine account in source_ip. Label newly_created_user only when account-creation evidence exists (for example 4720/4722) and the user was not already present earlier in the evidence window. Existing observed users should stay observed_user, suspicious_user, actor_candidate, or victim_user unless direct creation evidence says otherwise."
json_field_extractors:
  SubjectUserName: "json_extract_string(raw_json, '$.SubjectUserName')"
  TargetUserName: "json_extract_string(raw_json, '$.TargetUserName')"
  TargetDomainName: "json_extract_string(raw_json, '$.TargetDomainName')"
  IpAddress: "json_extract_string(raw_json, '$.IpAddress')"
  IpPort: "json_extract_string(raw_json, '$.IpPort')"
  LogonType: "json_extract_string(raw_json, '$.LogonType')"
  ProcessName: "json_extract_string(raw_json, '$.ProcessName')"
  CommandLine: "json_extract_string(raw_json, '$.CommandLine')"
  ServiceName: "json_extract_string(raw_json, '$.ServiceName')"
  ServiceFileName: "json_extract_string(raw_json, '$.ServiceFileName')"