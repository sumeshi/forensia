id: windows-smbclient-30803-30807-connectivity
title: SMB client connection/disconnection events
severity: low
confidence: 0.4
required_fields:
- computer
tags:
- windows
- smb
- network
attack:
- tactic: lateral-movement
  technique_id: T1021.002
  technique_name: SMB/Windows Admin Shares
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    event_id,\n    target_server,\n    message\nFROM evtx_events\nWHERE event_id IN (30803, 30804, 30805, 30806, 30807)\n  AND LOWER(COALESCE(channel, '')) LIKE '%smbclient%'\n"
finding:
  title: SMB client event {event_id} on {computer}
  summary: 'SMB client connectivity event {event_id} on {computer} at {timestamp}. Target: {target_server}. Details: {message}.'
