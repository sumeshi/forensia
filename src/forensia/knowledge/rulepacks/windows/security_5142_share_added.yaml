id: windows-security-5142-share-added
title: Network share object added
severity: medium
confidence: 0.6
required_fields:
- subject_user
- computer
- share_name
tags:
- windows
- lateral-movement
- defense-evasion
attack:
- tactic: command-and-control
  technique_id: T1071
  technique_name: Application Layer Protocol
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    subject_user,\n    share_name\nFROM evtx_events\nWHERE event_id = 5142\n"
finding:
  title: 'Share added: {share_name} @ {computer}'
  summary: '{subject_user} added network share ''{share_name}'' on {computer} at {timestamp}. Attackers may add shares for lateral movement or data staging.'
