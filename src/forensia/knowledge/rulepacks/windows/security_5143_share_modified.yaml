id: windows-security-5143-share-modified
title: Network share object modified
severity: medium
confidence: 0.6
required_fields:
- subject_user
- computer
- share_name
tags:
- windows
- lateral-movement
- defense-evasion
attack:
- tactic: command-and-control
  technique_id: T1071
  technique_name: Application Layer Protocol
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    subject_user,\n    share_name\nFROM evtx_events\nWHERE event_id = 5143\n"
finding:
  title: 'Share modified: {share_name} @ {computer}'
  summary: '{subject_user} modified network share ''{share_name}'' on {computer} at {timestamp}. Changes to share permissions may indicate preparation for lateral movement.'
