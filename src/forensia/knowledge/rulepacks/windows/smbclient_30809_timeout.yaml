id: windows-smbclient-30809-timeout
title: SMB client connection timed out
severity: medium
confidence: 0.6
required_fields:
- computer
- target_server
tags:
- windows
- smb
- network
attack:
- tactic: lateral-movement
  technique_id: T1021.002
  technique_name: SMB/Windows Admin Shares
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    target_server,\n    message\nFROM evtx_events\nWHERE event_id = 30809\n  AND LOWER(COALESCE(channel, '')) LIKE '%smbclient%'\n"
finding:
  title: SMB connection timeout on {computer}
  summary: 'SMB connection to ''{target_server}'' timed out on {computer} at {timestamp}. Details: {message}. May indicate network connectivity issues or EDR blocking.'
