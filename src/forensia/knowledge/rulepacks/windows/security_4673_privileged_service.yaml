id: windows-security-4673-privileged-service-called
title: Privileged service called (Event 4673)
severity: medium
confidence: 0.6
required_fields:
- subject_user
- computer
- message
tags:
- windows
- privilege-escalation
attack:
- tactic: privilege-escalation
  technique_id: T1078
  technique_name: Valid Accounts
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    subject_user,\n    message\nFROM evtx_events\nWHERE event_id = 4673\n"
finding:
  title: Privileged service called on {computer}
  summary: '{subject_user} called a privileged service on {computer} at {timestamp}. Details: {message}. Requires ''Audit Sensitive Privilege Use'' policy enabled.'
