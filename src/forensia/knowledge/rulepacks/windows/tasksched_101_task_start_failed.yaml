id: windows-taskscheduler-101-task-start-failed
title: Task started and failed immediately
severity: medium
confidence: 0.7
required_fields:
- computer
- task_name
tags:
- windows
- scheduled-task
- failed-execution
attack:
- tactic: execution
  technique_id: T1053
  technique_name: Scheduled Task/Job
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    task_name,\n    message\nFROM evtx_events\nWHERE event_id = 101\n  AND LOWER(COALESCE(channel, '')) LIKE '%taskscheduler%'\n"
finding:
  title: 'Task start failed: {task_name} @ {computer}'
  summary: 'Task ''{task_name}'' failed to start on {computer} at {timestamp}. Details: {message}. May indicate missing executables or permission issues from attacker-planted tasks.'
