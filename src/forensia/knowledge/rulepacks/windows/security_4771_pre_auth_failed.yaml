id: windows-security-4771-pre-auth-failed
title: Kerberos pre-authentication failures (Event 4771)
severity: medium
confidence: 0.6
tags:
- windows
- kerberos
- brute-force
attack:
- tactic: credential-access
  technique_id: T1110
  technique_name: Brute Force
query: "SELECT\n    target_user,\n    DATE_TRUNC('hour', timestamp) AS hour_bucket,\n    COUNT(*) AS fail_count,\n    MIN(timestamp) AS first_seen,\n    MAX(timestamp) AS last_seen\nFROM evtx_events\nWHERE event_id = 4771\n  AND COALESCE(target_user, '') NOT IN ('', '-')\nGROUP BY target_user, DATE_TRUNC('hour', timestamp)\nHAVING COUNT(*) >= 5\n"
finding:
  title: 'Repeated Kerberos pre-authentication failures: {target_user}'
  summary: '{fail_count} Kerberos pre-authentication failures (4771) for {target_user} were observed in the {hour_bucket} window between {first_seen} and {last_seen}. This may indicate password spraying or brute-force activity.'
