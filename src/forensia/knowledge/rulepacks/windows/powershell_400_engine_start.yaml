id: windows-powershell-400-engine-start
title: PowerShell engine start (Event 400)
severity: low
confidence: 0.3
tags:
- windows
- powershell
- execution
attack:
- tactic: execution
  technique_id: T1059.001
  technique_name: PowerShell
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    target_user,\n    channel,\n    message\nFROM evtx_events\nWHERE event_id = 400\n  AND LOWER(COALESCE(channel, '')) LIKE '%powershell%'\n"
finding:
  title: 'PowerShell engine start: {computer}'
  summary: 'A PowerShell engine start event (400) was observed on {computer} at {timestamp}. Channel: {channel}. User: {target_user}. This is supporting telemetry only; correlate with 4104 script block logging to identify what was actually executed.'
