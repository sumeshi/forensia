id: windows-security-4702-task-updated
title: Scheduled task updated
severity: medium
confidence: 0.65
required_fields:
- subject_user
- computer
- task_name
tags:
- windows
- scheduled-task
- defense-evasion
attack:
- tactic: persistence
  technique_id: T1053
  technique_name: Scheduled Task/Job
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    task_name,\n    subject_user\nFROM evtx_events\nWHERE event_id = 4702\n"
finding:
  title: 'Task updated: {task_name} @ {computer}'
  summary: Scheduled task '{task_name}' was updated on {computer} at {timestamp} by {subject_user}. Attackers may modify tasks to change execution parameters or targets.
