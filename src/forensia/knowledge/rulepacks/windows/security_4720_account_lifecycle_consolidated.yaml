id: windows-security-4720-account-lifecycle
title: Account lifecycle events (Create, Enable, Password Reset, Delete)
severity: high
confidence: 0.7
required_fields:
- target_user
- computer
- subject_user
- event_id
tags:
- windows
- account-management
- persistence
- credential-abuse
attack:
- tactic: persistence
  technique_id: T1136.001
  technique_name: Local Account
- tactic: persistence
  technique_id: T1098
  technique_name: Account Manipulation
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    event_id,\n    target_user,\n    subject_user,\n    json_extract_string(raw_json, '$.EventData.TargetDomainName') AS target_domain,\n    json_extract_string(raw_json, '$.EventData.TargetSid') AS target_sid\nFROM evtx_events\nWHERE event_id IN (4720, 4722, 4724, 4726)\n"
finding:
  title: Account lifecycle event on {computer}
  summary: Event {event_id} for user {target_user} by {subject_user}
hypotheses:
- id: windows-security-4720-backdoor-account
  segment: persistence
  description: Account {target_user} was created (4720) on {computer} as a potential backdoor, especially if followed by group membership changes (4732) or logon (4624)
  required_entities:
  - computer
  - target_user
  - target_sid
  confirm_when:
    co_observed_event_ids:
    - 4732
    - 4624
  refute_when:
    zero_rows: true
  follow_up_questions:
  - 4624 logon by the created account
  - 4732 group membership change for the account
  report_sections:
  - 3_technical
- id: windows-security-4724-password-reset
  segment: credential-access
  description: Password reset (4724) performed by {subject_user} for {target_user} on {computer} — potential privilege escalation or account takeover
  required_entities:
  - computer
  - target_user
  - subject_user
  confirm_when:
    # Account-management family only.  4624 (account logon) is NOT a
    # confirmation of a password reset; a reset (4724) is corroborated by an
    # accompanying account-management event such as 4738 (account changed),
    # never by a generic logon.
    co_observed_event_ids:
    - 4738
  refute_when:
    zero_rows: true
  follow_up_questions:
  - 4738 account changed after password reset
  report_sections:
  - 3_technical
