id: windows-smbclient-31001-security-context
title: Security context initialization failed
severity: medium
confidence: 0.65
required_fields:
- computer
- target_server
tags:
- windows
- smb
- failed-access
attack:
- tactic: lateral-movement
  technique_id: T1021
  technique_name: Remote Services
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    target_server,\n    message\nFROM evtx_events\nWHERE event_id = 31001\n  AND LOWER(COALESCE(channel, '')) LIKE '%smbclient%'\n"
finding:
  title: Security context failed on {computer}
  summary: 'Security context initialization failed on {computer} at {timestamp}. Target: {target_server}. Details: {message}. May indicate authentication issues.'
