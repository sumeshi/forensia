id: windows-security-4674-privileged-object-operation
title: Privileged object operation attempted (Event 4674)
severity: medium
confidence: 0.6
required_fields:
- subject_user
- computer
- message
tags:
- windows
- privilege-escalation
attack:
- tactic: privilege-escalation
  technique_id: T1078
  technique_name: Valid Accounts
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    subject_user,\n    message\nFROM evtx_events\nWHERE event_id = 4674\n"
finding:
  title: Privileged object operation on {computer}
  summary: '{subject_user} attempted a privileged object operation on {computer} at {timestamp}. Details: {message}. May indicate credential access or defense evasion.'
