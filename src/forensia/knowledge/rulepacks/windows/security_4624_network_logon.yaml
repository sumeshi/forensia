id: windows-security-4624-network-logon
title: Network logon (LogonType=3)
severity: medium
confidence: 0.5
required_fields:
- target_user
- computer
- src_ip
- logon_type
tags:
- windows
- logon
- lateral-movement
attack:
- tactic: lateral-movement
  technique_id: T1021.002
  technique_name: SMB/Windows Admin Shares
query: "WITH normalized AS (\n    SELECT\n        evidence_id,\n        event_id,\n        timestamp,\n        computer,\n        target_user,\n        subject_user,\n        src_ip,\n        logon_type,\n        TRIM(COALESCE(src_ip, '')) AS normalized_src_ip,\n        UPPER(TRIM(COALESCE(target_user, ''))) AS normalized_target_user\n    FROM evtx_events\n    WHERE event_id = 4624\n      AND logon_type = '3'\n)\nSELECT\n    evidence_id,\n    event_id,\n    timestamp,\n    computer,\n    target_user,\n    subject_user,\n    src_ip,\n    logon_type\nFROM normalized\nWHERE normalized_src_ip NOT IN ('', '-', '::1', '127.0.0.1')\n  AND normalized_src_ip NOT LIKE '::ffff:127.%'\n  AND normalized_target_user NOT IN ('ANONYMOUS LOGON', 'SYSTEM', 'LOCAL SERVICE', 'NETWORK SERVICE')\n  AND normalized_target_user NOT LIKE '%$'\n"
finding:
  title: 'Network logon: {target_user} -> {computer}'
  summary: '{target_user} successfully authenticated with a network logon (LogonType=3) on {computer} at {timestamp}. Source IP: {src_ip}. This may be the starting point for lateral movement such as PsExec, WinRM, or net use.'
