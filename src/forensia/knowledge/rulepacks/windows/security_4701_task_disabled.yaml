id: windows-security-4701-task-disabled
title: Scheduled task disabled
severity: medium
confidence: 0.65
required_fields:
- subject_user
- computer
- task_name
tags:
- windows
- scheduled-task
- defense-evasion
attack:
- tactic: persistence
  technique_id: T1053
  technique_name: Scheduled Task/Job
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    task_name,\n    subject_user\nFROM evtx_events\nWHERE event_id = 4701\n"
finding:
  title: 'Task disabled: {task_name} @ {computer}'
  summary: '{subject_user} disabled scheduled task ''{task_name}'' on {computer} at {timestamp}. Attackers may disable security monitoring tasks.'
