id: windows-security-4728-group-change
title: Security group membership additions
severity: high
confidence: 0.75
required_fields:
- target_user
- computer
- subject_user
- event_id
- message
tags:
- windows
- group-management
- privilege-escalation
- account-management
attack:
- tactic: persistence
  technique_id: T1098
  technique_name: Account Manipulation
- tactic: privilege-escalation
  technique_id: T1078
  technique_name: Valid Accounts
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    event_id,\n    target_user,\n    subject_user,\n    message\nFROM evtx_events\nWHERE event_id IN (4728, 4732)\n"
finding:
  title: Group membership addition on {computer}
  summary: Event {event_id} — account {target_user} was added to a security group by {subject_user} on {computer}. Verify the target group and administrative authorization before treating this as privilege escalation.
hypotheses:
- id: windows-security-4728-privilege-escalation
  segment: privilege-escalation
  description: Account {target_user} was added to a privileged group by {subject_user} on {computer}, indicating potential privilege escalation
  required_entities:
  - computer
  - target_user
  - subject_user
  refute_when:
    zero_rows: true
  follow_up_questions:
  - Was the target account subsequently used for logon (4624)?
  - Was the adding account compromised?
  report_sections:
  - 3_technical
  - 4_gaps
correlate_with:
- event_ids:
  - 4720
  - 4624
  rationale: account created then added to group, or group member logon
