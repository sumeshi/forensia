id: windows-security-4770-kerberos-ticket-renewed
title: Kerberos service ticket renewed
severity: low
confidence: 0.4
required_fields:
- target_user
- computer
- service_name
tags:
- windows
- kerberos
- lateral-movement
attack:
- tactic: lateral-movement
  technique_id: T1550.003
  technique_name: 'Use Alternate Authentication Material: Pass the Ticket'
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    target_user,\n    service_name,\n    message\nFROM evtx_events\nWHERE event_id = 4770\n"
finding:
  title: Kerberos ticket renewed for {service_name}
  summary: '{target_user} renewed a Kerberos service ticket for ''{service_name}'' on {computer} at {timestamp}. Indicates ongoing service access. Review for legitimate use.'
