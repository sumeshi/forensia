id: windows-system-7036-service-state
title: Service state change for security or backup software (System Event 7036)
severity: low
confidence: 0.3
tags:
- windows
- service
- defense-evasion
attack:
- tactic: defense-evasion
  technique_id: T1562.001
  technique_name: Disable or Modify Tools
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    service_name,\n    message\nFROM evtx_events\nWHERE event_id = 7036\n  AND (\n    LOWER(COALESCE(service_name, '')) LIKE '%defender%'\n    OR LOWER(COALESCE(service_name, '')) LIKE '%sentinel%'\n    OR LOWER(COALESCE(service_name, '')) LIKE '%crowd%'\n    OR LOWER(COALESCE(service_name, '')) LIKE '%carbon%'\n    OR LOWER(COALESCE(service_name, '')) LIKE '%backup%'\n    OR LOWER(COALESCE(service_name, '')) LIKE '%veeam%'\n    OR LOWER(COALESCE(service_name, '')) LIKE '%sophos%'\n    OR LOWER(COALESCE(service_name, '')) LIKE '%symantec%'\n    OR LOWER(COALESCE(service_name, '')) LIKE '%trend%'\n    OR LOWER(COALESCE(service_name, '')) LIKE '%kaspersky%'\n    OR LOWER(COALESCE(service_name, '')) LIKE '%mcafee%'\n    OR LOWER(COALESCE(service_name, '')) LIKE '%avast%'\n    OR LOWER(COALESCE(service_name, '')) LIKE '%avira%'\n    OR LOWER(COALESCE(message, '')) LIKE '%running%'\n    OR LOWER(COALESCE(message, '')) LIKE '%stopped%'\n  )\n"
finding:
  title: 'Important service state transition: {service_name} @ {computer}'
  summary: 'A service state transition (7036) for ''{service_name}'' was observed on {computer} at {timestamp}. Details: {message}. Check whether EDR, AV, or backup services were stopped or restarted.'
