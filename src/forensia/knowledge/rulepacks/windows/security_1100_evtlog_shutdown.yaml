id: windows-security-1100-evtlog-shutdown
title: Event Log service shutdown (Event 1100)
severity: low
confidence: 0.5
tags:
- windows
- log-lifecycle
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    subject_user,\n    message\nFROM evtx_events\nWHERE event_id = 1100\n"
finding:
  title: 'Event Log service stopped: {computer}'
  summary: 'Event Log service stop (1100) was observed on {computer} at {timestamp}. This is a normal OS lifecycle event during shutdown. Only investigate if correlated with log clearing (1102/104) or unexpected log gaps.'
