id: windows-system-6005-6006-eventlog-service
title: Event Log service start/stop
severity: medium
confidence: 0.7
required_fields:
- computer
- message
tags:
- windows
- log-tampering
- defense-evasion
attack:
- tactic: defense-evasion
  technique_id: T1070.001
  technique_name: 'Indicator Removal: Clear Windows Event Logs'
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    event_id,\n    user_name,\n    message\nFROM evtx_events\nWHERE event_id IN (6005, 6006)\n  AND LOWER(COALESCE(channel, '')) LIKE '%system%'\n"
finding:
  title: Event Log service activity on {computer}
  summary: Event Log service (6005/6006) activity on {computer} at {timestamp}. Combined with 1100/1102, this may indicate log clearing activity. Verify log completeness.
