id: windows-system-6005-6006-eventlog-service
title: Event Log service start/stop
severity: low
confidence: 0.5
required_fields:
- computer
- message
tags:
- windows
- log-lifecycle
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    event_id,\n    user_name,\n    message\nFROM evtx_events\nWHERE event_id IN (6005, 6006)\n  AND LOWER(COALESCE(channel, '')) LIKE '%system%'\n"
finding:
  title: Event Log service activity on {computer}
  summary: Event Log service start (6005) or stop (6006) on {computer} at {timestamp}. These are normal OS lifecycle events during boot/shutdown. Only investigate if correlated with log clearing (1102/104) or unexpected log gaps.
