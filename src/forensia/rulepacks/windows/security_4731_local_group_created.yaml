id: windows-security-4731-local-group-created
title: Security-enabled local group created
severity: medium
confidence: 0.65
required_fields:
  - subject_user
  - target_group
  - computer
tags:
  - windows
  - account-management
  - persistence
attack:
  - T1078
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_group,
      subject_user
  FROM evtx_events
  WHERE event_id = 4731
finding:
  title: "Local group created: {target_group} @ {computer}"
  summary: "{subject_user} created local group '{target_group}' on {computer} at {timestamp}. May indicate attacker creating custom groups for privilege escalation."