id: windows-security-4729-global-group-removed
title: User removed from global security group (Event 4729)
severity: medium
confidence: 0.5
tags:
  - windows
  - account-management
  - privilege
attack:
  - T1098
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user,
      message
  FROM evtx_events
  WHERE event_id = 4729
finding:
  title: "Removed from a global security group: {target_user} @ {computer}"
  summary: "{subject_user} removed account '{target_user}' from a global security group on {computer} at {timestamp} (4729). This may reflect privilege revocation, but it can also be anti-forensics intended to hide privilege abuse after compromise."
