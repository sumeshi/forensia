id: windows-security-4738-account-changed
title: User account changed (Event 4738)
severity: medium
confidence: 0.5
tags:
  - windows
  - account-management
attack:
  - T1098
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user,
      message
  FROM evtx_events
  WHERE event_id = 4738
finding:
  title: "Account attributes changed: {target_user} @ {computer}"
  summary: "{subject_user} changed account '{target_user}' on {computer} at {timestamp} (4738). Details: {message}. Verify which attribute changed; SID history changes or edits to descriptive fields can indicate account hijacking."
