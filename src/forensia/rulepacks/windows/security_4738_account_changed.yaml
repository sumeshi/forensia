id: windows-security-4738-account-changed
title: User account changed (Event 4738)
severity: medium
confidence: 0.5
tags:
  - windows
  - account-management
attack:
  - T1098
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user,
      message
  FROM evtx_events
  WHERE event_id = 4738
finding:
  title: "アカウント属性変更: {target_user} @ {computer}"
  summary: "{timestamp} に {computer} で {subject_user} がアカウント '{target_user}' を変更(4738)。詳細: {message}。説明欄や制御フラグ変更などの痕跡を確認する。"
