id: windows-rdp-rcm-1149-user-auth-success
title: RDP user authentication success (RemoteConnectionManager Event 1149)
severity: medium
confidence: 0.5
tags:
- windows
- rdp
- terminalservices
attack:
- tactic: lateral-movement
  technique_id: T1021.001
  technique_name: Remote Desktop Protocol
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    target_user,\n    src_ip,\n    channel,\n    message\nFROM evtx_events\nWHERE event_id = 1149\n  AND LOWER(COALESCE(channel, '')) LIKE '%remoteconnectionmanager%'\n"
finding:
  title: 'RDP user authentication success: {target_user} @ {computer}'
  summary: 'RemoteConnectionManager user authentication success (1149) was observed on {computer} at {timestamp}. Source IP: {src_ip}. Do not treat this event alone as proof of an interactive logon; correlate with 4624 (LogonType=10) and LSM 21.'
