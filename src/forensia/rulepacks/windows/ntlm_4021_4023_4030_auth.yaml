id: windows-ntlm-4021-4023-4030-auth
title: NTLM client authentication events
severity: medium
confidence: 0.6
required_fields:
  - computer
  - target_server
tags:
  - windows
  - ntlm
  - lateral-movement
attack:
  - T1021
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      event_id,
      target_server,
      message
  FROM evtx_events
  WHERE event_id IN (4021, 4023, 4030)
    AND LOWER(COALESCE(channel, '')) LIKE '%ntlm%'
finding:
  title: "NTLM auth event {event_id} on {computer}"
  summary: "NTLM authentication event {event_id} on {computer} at {timestamp}. Target: {target_server}. Details: {message}."