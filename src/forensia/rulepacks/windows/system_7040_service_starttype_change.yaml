id: windows-system-7040-service-starttype-change
title: Service start type changed (System Event 7040)
severity: medium
confidence: 0.65
tags:
  - windows
  - defense-evasion
  - service
attack:
  - T1562.001
  - T1543.003
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      service_name,
      message
  FROM evtx_events
  WHERE event_id = 7040
finding:
  title: "Service start type changed: {service_name} @ {computer}"
  summary: "The start type of service '{service_name}' was changed on {computer} at {timestamp}. Check whether AV or backup services were set to Disabled."
