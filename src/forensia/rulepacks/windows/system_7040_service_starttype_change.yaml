id: windows-system-7040-service-starttype-change
title: Service start type changed (System Event 7040)
severity: medium
confidence: 0.6
required_fields:
- computer
- service_name
- message
tags:
- windows
- service
- defense-evasion
attack:
- tactic: defense-evasion
  technique_id: T1562.001
  technique_name: Disable or Modify Tools
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    service_name,\n    message\nFROM evtx_events\nWHERE event_id = 7040\n"
finding:
  title: 'Service start type changed: {service_name} @ {computer}'
  summary: 'Service ''{service_name}'' start type was changed on {computer} at {timestamp}. Details: {message}. Attackers may change service start type to disable security tools or enable persistence.'
