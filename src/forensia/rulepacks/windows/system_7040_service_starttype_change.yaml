id: windows-system-7040-service-starttype
title: Service start type changed (System Event 7040)
severity: medium
confidence: 0.6
required_fields:
  - computer
  - service_name
  - message
tags:
  - windows
  - service
  - defense-evasion
attack:
  - T1562.001
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      service_name,
      message
  FROM evtx_events
  WHERE event_id = 7040
finding:
  title: "Service start type changed: {service_name} @ {computer}"
  summary: "Service '{service_name}' start type was changed on {computer} at {timestamp}. Details: {message}. Attackers may change service start type to disable security tools or enable persistence."