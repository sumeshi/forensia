id: windows-security-4737-global-group-changed
title: Security-enabled global group changed (Event 4737)
severity: medium
confidence: 0.65
required_fields:
  - subject_user
  - target_group
  - computer
tags:
  - windows
  - account-management
  - defense-evasion
attack:
  - T1078
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_group,
      subject_user,
      message
  FROM evtx_events
  WHERE event_id = 4737
finding:
  title: "Global group changed: {target_group} @ {computer}"
  summary: "{subject_user} changed global group '{target_group}' on {computer} at {timestamp}. Group properties or membership may have been modified for malicious purposes."