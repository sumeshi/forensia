id: windows-powershell-4105-script-started
title: PowerShell script block started (Event 4105)
severity: low
confidence: 0.3
tags:
  - windows
  - powershell
  - execution
attack:
  - T1059.001
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      channel,
      message
  FROM evtx_events
  WHERE event_id = 4105
    AND LOWER(COALESCE(channel, '')) LIKE '%powershell%'
finding:
  title: "PowerShell スクリプト実行開始: {computer}"
  summary: "{timestamp} に {computer} で PowerShell スクリプトブロック実行開始(4105)を確認。ユーザ: {target_user}。メッセージ: {message}。直後の 4104 と合わせて内容確認が必要。"
