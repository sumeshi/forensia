id: windows-powershell-4105-script-started
title: PowerShell script block started (Event 4105)
severity: low
confidence: 0.3
tags:
  - windows
  - powershell
  - execution
attack:
  - T1059.001
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      channel,
      message
  FROM evtx_events
  WHERE event_id = 4105
    AND LOWER(COALESCE(channel, '')) LIKE '%powershell%'
finding:
  title: "PowerShell script execution start: {computer}"
  summary: "PowerShell script block execution start (4105) was observed on {computer} at {timestamp}. User: {target_user}. Message: {message}. This is context telemetry; the actual script content should be confirmed with 4104, especially for encoded or obfuscated blocks."
