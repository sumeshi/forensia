id: windows-security-4697-service-install
title: Service installed (Security Event 4697)
severity: high
confidence: 0.75
required_fields:
  - subject_user
  - service_name
  - computer
tags:
  - windows
  - persistence
  - service
attack:
  - T1543.003
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user,
      service_name,
      message
  FROM evtx_events
  WHERE event_id = 4697
finding:
  title: "Service installation: {service_name} @ {computer}"
  summary: "{subject_user} installed service '{service_name}' on {computer} at {timestamp}. Review the executable path and investigate whether this represents persistence or malware deployment."
