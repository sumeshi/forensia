id: windows-security-4769-kerberos-service-ticket
title: Kerberos service ticket requested
severity: medium
confidence: 0.6
required_fields:
  - target_user
  - computer
  - service_name
tags:
  - windows
  - kerberos
  - lateral-movement
attack:
  - T1550.003
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      service_name
  FROM evtx_events
  WHERE event_id = 4769
finding:
  title: "Kerberos service ticket for {service_name}"
  summary: "{target_user} requested a Kerberos service ticket for '{service_name}' on {computer} at {timestamp}. This may indicate lateral movement or service access attempts. Check for suspicious service names."