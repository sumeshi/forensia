id: windows-security-4724-password-reset
title: Account password reset attempt (Event 4724)
severity: high
confidence: 0.7
tags:
  - windows
  - account-management
  - credential-abuse
attack:
  - T1098
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user
  FROM evtx_events
  WHERE event_id = 4724
finding:
  title: "Password reset: {target_user} (actor: {subject_user}) @ {computer}"
  summary: "{subject_user} reset the password for {target_user} on {computer} at {timestamp}. Treat resets involving privileged or administrator accounts as especially sensitive."
