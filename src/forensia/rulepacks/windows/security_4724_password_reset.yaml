id: windows-security-4724-password-reset
title: Account password reset attempt (Event 4724)
severity: high
confidence: 0.7
tags:
  - windows
  - account-management
  - credential-abuse
attack:
  - T1098
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user
  FROM evtx_events
  WHERE event_id = 4724
finding:
  title: "パスワードリセット: {target_user} (実行者: {subject_user}) @ {computer}"
  summary: "{timestamp} に {computer} で {subject_user} が {target_user} のパスワードをリセット。特権アカウントや管理者アカウントへの操作は特に注意。"
