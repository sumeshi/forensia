id: windows-security-4734-local-group-deleted
title: Security-enabled local group deleted
severity: high
confidence: 0.75
required_fields:
  - subject_user
  - target_group
  - computer
tags:
  - windows
  - account-management
  - defense-evasion
attack:
  - T1078
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_group,
      subject_user
  FROM evtx_events
  WHERE event_id = 4734
finding:
  title: "Local group deleted: {target_group} @ {computer}"
  summary: "{subject_user} deleted local group '{target_group}' on {computer} at {timestamp}. Attackers may delete groups to remove evidence of their activities."