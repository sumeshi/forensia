id: windows-corr-rdp-then-powershell
title: RDP then PowerShell execution
severity: high
confidence: 0.85
tags:
  - windows
  - correlation
  - powershell
attack:
  - T1021.001
  - T1059.001
query: |
  SELECT
      l.evidence_id,
      l.timestamp AS logon_time,
      l.computer,
      l.target_user,
      l.src_ip,
      p.timestamp AS powershell_time,
      p.command_line
  FROM evtx_events l
  JOIN evtx_events p
    ON l.computer = p.computer
   AND p.timestamp BETWEEN l.timestamp AND l.timestamp + INTERVAL 30 MINUTE
  WHERE l.event_id = 4624
    AND l.logon_type = '10'
    AND lower(coalesce(p.process_name, '')) LIKE '%powershell%'
finding:
  title: "PowerShell execution after RDP logon: {target_user}@{computer}"
  summary: "PowerShell execution was observed at {powershell_time} after an RDP logon at {logon_time}. Source IP: {src_ip}. PowerShell shortly after RDP is a classic lateral movement pattern; review script content (4104) and subsequent network connections."
