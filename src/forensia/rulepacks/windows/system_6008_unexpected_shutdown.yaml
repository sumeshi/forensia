id: windows-system-6008-unexpected-shutdown
title: Unexpected shutdown record (System Event 6008)
severity: low
confidence: 0.3
tags:
  - windows
  - shutdown
attack:
  - T1529
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      message
  FROM evtx_events
  WHERE event_id = 6008
finding:
  title: "Unexpected shutdown artifact: {computer}"
  summary: "An unexpected shutdown artifact (6008) was observed on {computer} at {timestamp}. Details: {message}. Correlate with events 41 and 1074, and consider whether this was power loss, a crash, or an attacker-triggered reboot intended to clear in-memory evidence."
