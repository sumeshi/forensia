id: windows-smbclient-30809-timeout
title: SMB client connection timed out
severity: medium
confidence: 0.6
required_fields:
  - computer
  - target_server
tags:
  - windows
  - smb
  - network
attack:
  - T1021.002
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_server,
      message
  FROM evtx_events
  WHERE event_id = 30809
    AND LOWER(COALESCE(channel, '')) LIKE '%smbclient%'
finding:
  title: "SMB connection timeout on {computer}"
  summary: "SMB connection to '{target_server}' timed out on {computer} at {timestamp}. Details: {message}. May indicate network connectivity issues or EDR blocking."