id: windows-security-4688-powershell
title: PowerShell execution via process creation (Event 4688)
severity: medium
confidence: 0.6
tags:
  - windows
  - powershell
  - execution
attack:
  - T1059.001
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      process_name,
      command_line
  FROM evtx_events
  WHERE event_id = 4688
    AND (
        LOWER(process_name) LIKE '%powershell.exe'
        OR LOWER(process_name) LIKE '%pwsh.exe'
    )
finding:
  title: "PowerShell実行: {target_user} @ {computer}"
  summary: "{timestamp} に {computer} で {target_user} が PowerShell を実行。コマンドライン: {command_line}。エンコードコマンドや-exec bypass等の不審なフラグがないか確認要。"
