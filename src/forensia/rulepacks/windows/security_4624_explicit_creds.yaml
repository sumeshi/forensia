id: windows-security-4624-explicit-creds
title: NewCredentials logon (LogonType=9 / RUNAS /NETWORK)
severity: high
confidence: 0.7
tags:
  - windows
  - logon
  - credential-abuse
attack:
  - T1078
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user,
      src_ip,
      logon_type
  FROM evtx_events
  WHERE event_id = 4624
    AND logon_type = '9'
finding:
  title: "Explicit credentials logon (LogonType=9): {subject_user} -> {target_user}"
  summary: "{subject_user} used alternate credentials ({target_user}) to log on at {timestamp} on {computer}. This is a typical pattern for RUNAS /NETWORK or impersonation."
