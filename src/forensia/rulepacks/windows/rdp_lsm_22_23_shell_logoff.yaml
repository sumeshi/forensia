id: windows-rdp-lsm-22-23-shell-logoff
title: RDP shell start and session logoff (LocalSessionManager Events 22/23)
severity: low
confidence: 0.4
tags:
  - windows
  - rdp
  - terminalservices
attack:
  - T1021.001
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      event_id,
      channel,
      message
  FROM evtx_events
  WHERE event_id IN (22, 23)
    AND LOWER(COALESCE(channel, '')) LIKE '%localsessionmanager%'
finding:
  title: "RDP session event {event_id}: {target_user} @ {computer}"
  summary: "LocalSessionManager event {event_id} on {computer} at {timestamp}. User: {target_user}. Event 22 means the shell start notification was received (session active); event 23 means a successful session logoff. Correlate with events 21 and 24 to reconstruct the full RDP session lifecycle."
