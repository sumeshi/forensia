id: windows-rdp-lsm-21-logon
title: RDP session logon success (LocalSessionManager Event 21)
severity: medium
confidence: 0.5
tags:
  - windows
  - rdp
  - terminalservices
attack:
  - T1021.001
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      src_ip,
      channel,
      message
  FROM evtx_events
  WHERE event_id = 21
    AND LOWER(COALESCE(channel, '')) LIKE '%localsessionmanager%'
finding:
  title: "RDP セッションログオン成功: {target_user} @ {computer}"
  summary: "{timestamp} に {computer} で LocalSessionManager の RDP セッションログオン成功(21)を確認。送信元IP: {src_ip}。Security 4624(LogonType=10) と併せて利用者確認を行う。"
