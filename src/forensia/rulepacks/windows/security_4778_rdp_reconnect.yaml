id: windows-security-4778-rdp-reconnect
title: RDP session reconnect (Event 4778)
severity: medium
confidence: 0.65
tags:
  - windows
  - rdp
  - lateral-movement
attack:
  - T1021.001
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      src_ip
  FROM evtx_events
  WHERE event_id = 4778
finding:
  title: "RDP session reconnect: {target_user} @ {computer}"
  summary: "{target_user} reconnected to an RDP session on {computer} at {timestamp} (4778). Source IP: {src_ip}. This may indicate reuse of an existing session by an attacker."
