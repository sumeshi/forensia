id: windows-smbserver-1024-1026-rdpclient
title: RDP client connection events
severity: medium
confidence: 0.65
required_fields:
  - computer
  - target_server
tags:
  - windows
  - rdp
  - lateral-movement
attack:
  - T1021.001
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      event_id,
      target_server,
      message
  FROM evtx_events
  WHERE event_id IN (1024, 1026)
    AND LOWER(COALESCE(channel, '')) LIKE '%rdpclient%'
finding:
  title: "RDP client event {event_id} on {computer}"
  summary: "RDP client event {event_id} on {computer} at {timestamp}. Target: {target_server}. Details: {message}."