id: windows-tasksched-141-task-deleted
title: Scheduled task deleted (TaskScheduler Event 141)
severity: medium
confidence: 0.6
tags:
  - windows
  - anti-forensics
  - scheduled-task
attack:
  - T1070.004
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      subject_user,
      channel,
      message
  FROM evtx_events
  WHERE event_id = 141
    AND LOWER(COALESCE(channel, '')) LIKE '%taskscheduler%'
finding:
  title: "Task deleted: {computer} ({subject_user})"
  summary: "A TaskScheduler Operational task deletion event (141) was observed on {computer} at {timestamp}. Actor: {subject_user}. Check whether the task was deleted shortly after creation."
