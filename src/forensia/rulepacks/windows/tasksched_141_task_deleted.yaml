id: windows-tasksched-141-task-deleted
title: Scheduled task deleted (TaskScheduler Event 141)
severity: medium
confidence: 0.6
tags:
  - windows
  - anti-forensics
  - scheduled-task
attack:
  - T1070.004
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      subject_user,
      channel,
      message
  FROM evtx_events
  WHERE event_id = 141
    AND LOWER(COALESCE(channel, '')) LIKE '%taskscheduler%'
finding:
  title: "タスク削除: {computer} ({subject_user})"
  summary: "{timestamp} に {computer} で TaskScheduler Operational のタスク削除(141)を確認。実行者: {subject_user}。作成後短時間で削除されていないか確認する。"
