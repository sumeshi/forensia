id: windows-security-4616-time-changed
title: System time changed by non-service account (Event 4616)
severity: high
confidence: 0.7
tags:
  - windows
  - anti-forensics
  - time
attack:
  - T1070.006
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user,
      message
  FROM evtx_events
  WHERE event_id = 4616
    AND COALESCE(subject_user, target_user, '') NOT IN ('SYSTEM', 'LOCAL SERVICE', 'NETWORK SERVICE')
finding:
  title: "システム時刻変更: {computer} ({subject_user})"
  summary: "{timestamp} に {computer} で {subject_user} がシステム時刻を変更(4616)。詳細: {message}。ログ時系列攪乱やアンチフォレンジックの可能性が高い。"
