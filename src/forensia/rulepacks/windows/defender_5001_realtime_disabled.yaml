id: windows-defender-5001-realtime-disabled
title: Windows Defender real-time protection disabled (Event 5001)
severity: high
confidence: 0.9
tags:
  - windows
  - defense-evasion
  - defender
attack:
  - T1562.001
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      message
  FROM evtx_events
  WHERE event_id = 5001
finding:
  title: "[HIGH] Defender real-time protection disabled (5001): {computer}"
  summary: "Windows Defender real-time protection was disabled on {computer} at {timestamp} (5001). Correlate with subsequent 4688 process execution to determine whether protection was turned off in preparation for malware execution."
