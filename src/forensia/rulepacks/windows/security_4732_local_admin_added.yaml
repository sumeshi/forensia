id: windows-security-4732-local-admin-added
title: User added to local Administrators group (Event 4732)
severity: critical
confidence: 0.85
tags:
  - windows
  - privilege-escalation
  - account-management
attack:
  - T1098
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user,
      message
  FROM evtx_events
  WHERE event_id = 4732
    AND LOWER(COALESCE(message, '')) LIKE '%administrators%'
finding:
  title: "ローカルAdministrators追加: {target_user} @ {computer}"
  summary: "{timestamp} に {computer} で {subject_user} がアカウント '{target_user}' をAdministratorsグループに追加。ローカル権限昇格の証拠。"
