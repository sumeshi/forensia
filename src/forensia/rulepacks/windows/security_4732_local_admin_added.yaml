id: windows-security-4732-local-admin-added
title: User added to local Administrators group (Event 4732)
severity: critical
confidence: 0.85
required_fields:
  - subject_user
  - target_user
  - computer
  - message
tags:
  - windows
  - privilege-escalation
  - account-management
attack:
  - T1098
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user,
      message
  FROM evtx_events
  WHERE event_id = 4732
    AND LOWER(COALESCE(message, '')) LIKE '%administrators%'
finding:
  title: "Added to local Administrators: {target_user} @ {computer}"
  summary: "{subject_user} added account '{target_user}' to the Administrators group on {computer} at {timestamp}. This is evidence of local privilege escalation."
