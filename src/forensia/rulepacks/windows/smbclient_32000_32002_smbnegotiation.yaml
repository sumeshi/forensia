id: windows-smbclient-32000-32002-smbv1
title: SMBv1 negotiation events
severity: medium
confidence: 0.7
required_fields:
  - computer
  - target_server
tags:
  - windows
  - smb
  - legacy
attack:
  - T1021
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      event_id,
      target_server,
      message
  FROM evtx_events
  WHERE event_id IN (32000, 32002)
    AND LOWER(COALESCE(channel, '')) LIKE '%smbclient%'
finding:
  title: "SMBv1 negotiation on {computer}"
  summary: "SMBv1 negotiation {event_id} with '{target_server}' on {computer} at {timestamp}. SMBv1 is legacy and may indicate older systems or non-Windows targets. Details: {message}."