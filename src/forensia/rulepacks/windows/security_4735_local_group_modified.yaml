id: windows-security-4735-local-group-modified
title: Security-enabled local group changed
severity: medium
confidence: 0.65
required_fields:
  - subject_user
  - target_group
  - computer
tags:
  - windows
  - account-management
attack:
  - T1078
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_group,
      subject_user,
      message
  FROM evtx_events
  WHERE event_id = 4735
finding:
  title: "Local group changed: {target_group} @ {computer}"
  summary: "{subject_user} changed local group '{target_group}' on {computer} at {timestamp}. Group properties may have been modified for malicious purposes."