id: windows-security-1101-audit-events-dropped
title: Audit events dropped due to transport failure
severity: high
confidence: 0.8
required_fields:
  - computer
tags:
  - windows
  - log-tampering
  - defense-evasion
attack:
  - T1070.001
query: |
  SELECT
      evidence_id,
      timestamp,
      computer
  FROM evtx_events
  WHERE event_id = 1101
finding:
  title: "Audit events dropped on {computer}"
  summary: "Event log transport dropped audit events on {computer} at {timestamp}. This indicates the security log may have been cleared or is incomplete. Check for 1100/1102/1104 for additional context."