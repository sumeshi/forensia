id: windows-tasksched-106-task-registered
title: Scheduled task registered (TaskScheduler Event 106)
severity: high
confidence: 0.7
tags:
  - windows
  - persistence
  - scheduled-task
attack:
  - T1053.005
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      subject_user,
      channel,
      message
  FROM evtx_events
  WHERE event_id = 106
    AND LOWER(COALESCE(channel, '')) LIKE '%taskscheduler%'
finding:
  title: "Task registered: {computer} ({subject_user})"
  summary: "A TaskScheduler Operational task registration event (106) was observed on {computer} at {timestamp}. Actor: {subject_user}. Message: {message}. Review together with 4698 for complementary task creation evidence."
