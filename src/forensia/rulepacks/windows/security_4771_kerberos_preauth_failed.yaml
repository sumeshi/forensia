id: windows-security-4771-kerberos-preauth-failed
title: Kerberos pre-authentication failed
severity: medium
confidence: 0.7
required_fields:
- target_user
- computer
- src_ip
- status
tags:
- windows
- kerberos
- credential-access
attack:
- tactic: credential-access
  technique_id: T1110.005
  technique_name: Brute Force
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    target_user,\n    src_ip,\n    status\nFROM evtx_events\nWHERE event_id = 4771\n"
finding:
  title: Kerberos pre-auth failed for {target_user}
  summary: 'Kerberos pre-authentication failed for ''{target_user}'' on {computer} at {timestamp}. Status: {status}, Source IP: {src_ip}. This may indicate password guessing or kerberoasting attempts.'
