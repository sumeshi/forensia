id: windows-system-41-unexpected-reboot
title: Unexpected reboot (System Event 41)
severity: low
confidence: 0.3
tags:
  - windows
  - reboot
attack:
  - T1529
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      message
  FROM evtx_events
  WHERE event_id = 41
finding:
  title: "Unexpected reboot: {computer}"
  summary: "An unexpected reboot (41) was observed on {computer} at {timestamp}. Details: {message}. A forced reboot may indicate a BSOD, driver crash, or anti-forensics; check kernel crash dumps and correlate with event 6008."
