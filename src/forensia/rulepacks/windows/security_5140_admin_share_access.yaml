id: windows-security-5140-admin-share-access
title: Administrative share accessed (Event 5140)
severity: high
confidence: 0.75
tags:
  - windows
  - lateral-movement
  - smb
attack:
  - T1021.002
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user,
      src_ip,
      message
  FROM evtx_events
  WHERE event_id = 5140
    AND (
        LOWER(COALESCE(message, '')) LIKE '%admin$%'
        OR LOWER(COALESCE(message, '')) LIKE '%c$%'
        OR LOWER(COALESCE(message, '')) LIKE '%ipc$%'
    )
finding:
  title: "Administrative share access: {src_ip} -> {computer}"
  summary: "Administrative share access (ADMIN$, C$, or IPC$) from {src_ip} to {computer} was observed at {timestamp}. User: {subject_user}. This is a classic artifact of PsExec or SMB-based lateral movement."
