id: windows-security-4768-tgt-request
title: Kerberos TGT request outside business hours (Event 4768)
severity: low
confidence: 0.4
tags:
  - windows
  - kerberos
  - authentication
attack:
  - T1558
query: |
  SELECT
      target_user,
      src_ip,
      COUNT(*) AS request_count,
      MIN(timestamp) AS first_seen,
      MAX(timestamp) AS last_seen
  FROM evtx_events
  WHERE event_id = 4768
    AND COALESCE(target_user, '') NOT IN ('', '-')
    AND COALESCE(src_ip, '') NOT IN ('', '-', '::1', '127.0.0.1')
    AND (
      EXTRACT(hour FROM timestamp) < 8
      OR EXTRACT(hour FROM timestamp) >= 20
    )
  GROUP BY target_user, src_ip
  HAVING COUNT(*) >= 3
finding:
  title: "After-hours Kerberos TGT requests: {target_user} ({src_ip})"
  summary: "{request_count} Kerberos TGT requests (4768) for {target_user} were observed from {src_ip} outside business hours between {first_seen} and {last_seen}. This may indicate suspicious authentication attempts or preparatory activity for lateral movement."
