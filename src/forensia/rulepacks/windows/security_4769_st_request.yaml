id: windows-security-4769-st-request
title: Kerberos service ticket request burst (Event 4769)
severity: low
confidence: 0.3
tags:
  - windows
  - kerberos
  - authentication
attack:
  - T1558.003
query: |
  WITH ticket_bursts AS (
      SELECT
          target_user,
          src_ip,
          DATE_TRUNC('hour', timestamp) AS hour_bucket,
          COUNT(*) AS request_count,
          MIN(timestamp) AS first_seen,
          MAX(timestamp) AS last_seen,
          MAX(message) AS sample_message
      FROM evtx_events
      WHERE event_id = 4769
        AND COALESCE(target_user, '') NOT IN ('', '-')
        AND COALESCE(src_ip, '') NOT IN ('', '-', '::1', '127.0.0.1')
      GROUP BY target_user, src_ip, DATE_TRUNC('hour', timestamp)
  )
  SELECT
      target_user,
      src_ip,
      hour_bucket,
      request_count,
      first_seen,
      last_seen,
      sample_message
  FROM ticket_bursts
  WHERE request_count >= 10
     OR LOWER(COALESCE(sample_message, '')) LIKE '%krbtgt%'
finding:
  title: "Kerberos サービスチケット要求の急増: {target_user} ({src_ip})"
  summary: "{target_user} に対するサービスチケット要求(4769)が {hour_bucket} 台に {request_count} 件発生 ({first_seen} ～ {last_seen})。サンプル: {sample_message}。大量要求や不自然な SPN 利用の確認が必要。"
