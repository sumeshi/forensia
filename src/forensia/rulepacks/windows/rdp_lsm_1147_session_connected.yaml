id: windows-terminalservices-lsm-1147
title: Remote Desktop Services session connected
severity: medium
confidence: 0.7
required_fields:
- computer
- target_user
tags:
- windows
- rdp
- lateral-movement
attack:
- tactic: lateral-movement
  technique_id: T1021.001
  technique_name: Remote Desktop Protocol
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    target_user\nFROM evtx_events\nWHERE event_id = 1147\n  AND channel LIKE '%LocalSessionManager%'\n"
finding:
  title: 'RDP session connected: {target_user} @ {computer}'
  summary: RDP session connected for '{target_user}' on {computer} at {timestamp}. Indicates active RDP session. Correlate with 4624 (Logon Type 10) for source IP.
