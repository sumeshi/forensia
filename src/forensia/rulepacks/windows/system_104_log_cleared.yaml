id: windows-system-104-log-cleared
title: Event log cleared (System Event 104)
severity: high
confidence: 0.9
tags:
- windows
- anti-forensics
- log-tampering
attack:
- tactic: defense-evasion
  technique_id: T1070.001
  technique_name: 'Indicator Removal: Clear Windows Event Logs'
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    target_user,\n    subject_user,\n    channel\nFROM evtx_events\nWHERE event_id = 104\n  AND LOWER(COALESCE(json_extract_string(raw_json, '$.winlog.provider.name'), '')) = 'microsoft-windows-eventlog'\n"
finding:
  title: 'Event log cleared (System 104): {computer}'
  summary: 'The {channel} log was cleared on {computer} at {timestamp} (System 104). Actor: {subject_user}. This may indicate that logs beyond Security, such as Application or System, were also intentionally removed.'
