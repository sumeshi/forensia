id: windows-system-104-log-cleared
title: Event log cleared (System Event 104)
severity: high
confidence: 0.9
tags:
  - windows
  - anti-forensics
  - log-tampering
attack:
  - T1070.001
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user,
      channel
  FROM evtx_events
  WHERE event_id = 104
finding:
  title: "Event log cleared (System 104): {computer}"
  summary: "The {channel} log was cleared on {computer} at {timestamp} (System 104). Actor: {subject_user}. This may indicate that logs beyond Security, such as Application or System, were also intentionally removed."
