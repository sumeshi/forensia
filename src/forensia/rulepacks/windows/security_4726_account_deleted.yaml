id: windows-security-4726-account-deleted
title: User account deleted (Event 4726)
severity: medium
confidence: 0.6
tags:
  - windows
  - account-management
  - anti-forensics
attack:
  - T1531
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user
  FROM evtx_events
  WHERE event_id = 4726
finding:
  title: "Account deleted: {target_user} (deleted by {subject_user}) @ {computer}"
  summary: "{subject_user} deleted account '{target_user}' on {computer} at {timestamp}. This may indicate anti-forensics; compare against 4720 to identify create-then-delete cycles."
