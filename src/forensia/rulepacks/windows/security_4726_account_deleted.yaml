id: windows-security-4726-account-deleted
title: User account deleted (Event 4726)
severity: medium
confidence: 0.6
tags:
  - windows
  - account-management
  - anti-forensics
attack:
  - T1531
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user
  FROM evtx_events
  WHERE event_id = 4726
finding:
  title: "アカウント削除: {target_user} (削除者: {subject_user}) @ {computer}"
  summary: "{timestamp} に {computer} で {subject_user} がアカウント '{target_user}' を削除。痕跡消去の可能性。4720と対比して作成→削除のサイクルがないか確認。"
