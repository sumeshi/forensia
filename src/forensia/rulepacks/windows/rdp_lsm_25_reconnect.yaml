id: windows-rdp-lsm-25-reconnect
title: RDP session reconnect (LocalSessionManager Event 25)
severity: medium
confidence: 0.5
tags:
  - windows
  - rdp
  - terminalservices
attack:
  - T1021.001
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      src_ip,
      channel,
      message
  FROM evtx_events
  WHERE event_id = 25
    AND LOWER(COALESCE(channel, '')) LIKE '%localsessionmanager%'
finding:
  title: "RDP session reconnect: {target_user} @ {computer}"
  summary: "An RDP session reconnect (LocalSessionManager 25) was observed on {computer} at {timestamp}. Source IP: {src_ip}. This may indicate reuse of an existing session by an attacker."
