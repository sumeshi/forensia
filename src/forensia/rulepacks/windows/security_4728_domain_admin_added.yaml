id: windows-security-4728-domain-admin-added
title: User added to global security group (Event 4728)
severity: critical
confidence: 0.85
tags:
  - windows
  - privilege-escalation
  - account-management
attack:
  - T1098
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user,
      message
  FROM evtx_events
  WHERE event_id = 4728
finding:
  title: "Added to a global security group: {target_user} @ {computer}"
  summary: "{subject_user} added account '{target_user}' to a global security group such as Domain Admins on {computer} at {timestamp}. This may indicate domain-level privilege escalation."
