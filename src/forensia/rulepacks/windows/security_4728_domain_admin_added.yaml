id: windows-security-4728-domain-admin-added
title: User added to global security group (Event 4728)
severity: critical
confidence: 0.85
tags:
  - windows
  - privilege-escalation
  - account-management
attack:
  - T1098
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user,
      message
  FROM evtx_events
  WHERE event_id = 4728
finding:
  title: "グローバルグループへの追加: {target_user} @ {computer}"
  summary: "{timestamp} に {computer} で {subject_user} がアカウント '{target_user}' をグローバルセキュリティグループ(Domain Admins等)に追加。ドメイン権限昇格の可能性。"
