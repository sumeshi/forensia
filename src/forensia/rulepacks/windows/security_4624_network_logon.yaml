id: windows-security-4624-network-logon
title: Network logon (LogonType=3)
severity: medium
confidence: 0.5
tags:
  - windows
  - logon
  - lateral-movement
attack:
  - T1021.002
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user,
      src_ip,
      logon_type
  FROM evtx_events
  WHERE event_id = 4624
    AND logon_type = '3'
    AND target_user NOT LIKE '%$'
finding:
  title: "Network logon: {target_user} -> {computer}"
  summary: "{target_user} successfully authenticated with a network logon (LogonType=3) on {computer} at {timestamp}. Source IP: {src_ip}. This may be the starting point for lateral movement such as PsExec, WinRM, or net use."
