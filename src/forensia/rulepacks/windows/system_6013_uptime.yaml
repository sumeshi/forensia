id: windows-system-6013-uptime
title: System uptime logged
severity: low
confidence: 0.3
required_fields:
  - computer
  - message
tags:
  - windows
  - system-info
attack:
  - T1033
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      message
  FROM evtx_events
  WHERE event_id = 6013
finding:
  title: "System uptime on {computer}"
  summary: "System uptime recorded on {computer} at {timestamp}. Uptime: {message}. Useful for timeline reconstruction and determining system availability."