id: windows-security-5144-share-deleted
title: Network share object deleted
severity: high
confidence: 0.7
required_fields:
- subject_user
- computer
- share_name
tags:
- windows
- defense-evasion
attack:
- tactic: command-and-control
  technique_id: T1071
  technique_name: Application Layer Protocol
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    subject_user,\n    share_name\nFROM evtx_events\nWHERE event_id = 5144\n"
finding:
  title: 'Share deleted: {share_name} @ {computer}'
  summary: '{subject_user} deleted network share ''{share_name}'' on {computer} at {timestamp}. Attackers may delete shares to remove evidence or hinder response.'
