id: windows-corr-bruteforce-then-success
title: Brute-force followed by successful logon within 10 minutes
severity: critical
confidence: 0.85
tags:
- windows
- brute-force
- logon
- correlation
attack:
- tactic: credential-access
  technique_id: T1110
  technique_name: Brute Force
query: "WITH failures AS (\n    SELECT\n        src_ip,\n        computer,\n        target_user,\n        COUNT(*) AS fail_count,\n        MIN(timestamp) AS first_fail,\n        MAX(timestamp) AS last_fail\n    FROM evtx_events\n    WHERE event_id = 4625\n      AND src_ip IS NOT NULL\n      AND src_ip NOT IN ('', '-', '::1', '127.0.0.1')\n    GROUP BY src_ip, computer, target_user\n    HAVING COUNT(*) >= 5\n),\nsuccesses AS (\n    SELECT\n        src_ip,\n        computer,\n        target_user,\n        timestamp AS success_time\n    FROM evtx_events\n    WHERE event_id = 4624\n      AND logon_type IN ('3', '10')\n)\nSELECT\n    f.src_ip,\n    f.computer,\n    f.target_user,\n    f.fail_count,\n    f.last_fail,\n    s.success_time\nFROM failures f\nJOIN successes s\n  ON f.src_ip = s.src_ip\n AND f.computer = s.computer\n AND f.target_user = s.target_user\n AND s.success_time BETWEEN f.last_fail AND f.last_fail + INTERVAL 10 MINUTE\n"
finding:
  title: 'Brute-force followed by successful logon: {src_ip} -> {computer} ({target_user})'
  summary: After {fail_count} failed logons from {src_ip} against {target_user} on {computer}, a successful logon occurred at {success_time}. This is a strong indicator that a brute-force or password spraying attempt succeeded.
hypotheses:
- id: brute_force_success_intrusion
  segment: credential-access
  description: '{fail_count} failed logons from {src_ip} followed by successful logon on {computer} as {target_user} indicates successful brute-force or password spray intrusion'
  required_entities:
  - src_ip
  - computer
  - target_user
  confirm_when:
    co_observed_event_ids:
    - 4625
    - 4624
    same_host: true
    within_minutes: 10
  refute_when:
    zero_rows: true
  follow_up_questions:
  - What actions were taken from {src_ip} after gaining access to {computer} as {target_user}?
  - Were lateral movement attempts observed from {computer} to other hosts?
  - What privilege level did {target_user} on {computer} have?
  report_sections:
  - 3_technical
  - 4_gaps
