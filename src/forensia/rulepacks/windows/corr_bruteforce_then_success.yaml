id: windows-corr-bruteforce-then-success
title: Brute-force followed by successful logon within 10 minutes
severity: critical
confidence: 0.85
tags:
  - windows
  - brute-force
  - logon
  - correlation
attack:
  - T1110
query: |
  WITH failures AS (
      SELECT
          src_ip,
          computer,
          target_user,
          COUNT(*) AS fail_count,
          MIN(timestamp) AS first_fail,
          MAX(timestamp) AS last_fail
      FROM evtx_events
      WHERE event_id = 4625
        AND src_ip IS NOT NULL
        AND src_ip NOT IN ('', '-', '::1', '127.0.0.1')
      GROUP BY src_ip, computer, target_user
      HAVING COUNT(*) >= 5
  ),
  successes AS (
      SELECT
          src_ip,
          computer,
          target_user,
          timestamp AS success_time
      FROM evtx_events
      WHERE event_id = 4624
        AND logon_type IN ('3', '10')
  )
  SELECT
      f.src_ip,
      f.computer,
      f.target_user,
      f.fail_count,
      f.last_fail,
      s.success_time
  FROM failures f
  JOIN successes s
    ON f.src_ip = s.src_ip
   AND f.computer = s.computer
   AND f.target_user = s.target_user
   AND s.success_time BETWEEN f.last_fail AND f.last_fail + INTERVAL 10 MINUTE
finding:
  title: "Brute-force followed by successful logon: {src_ip} -> {computer} ({target_user})"
  summary: "After {fail_count} failed logons from {src_ip} against {target_user} on {computer}, a successful logon occurred at {success_time}. This is a strong indicator that a brute-force or password spraying attempt succeeded."
hypotheses:
  - id: brute_force_success_intrusion
    segment: credential-access
    description: "{fail_count} failed logons from {src_ip} followed by successful logon on {computer} as {target_user} indicates successful brute-force or password spray intrusion"
    required_entities: [src_ip, computer, target_user]
    confirm_when:
      co_observed_event_ids: [4625, 4624]
      same_host: true
      within_minutes: 10
    refute_when:
      zero_rows: true
    follow_up_questions:
      - "What actions were taken from {src_ip} after gaining access to {computer} as {target_user}?"
      - "Were lateral movement attempts observed from {computer} to other hosts?"
      - "What privilege level did {target_user} on {computer} have?"
    report_sections: [3_technical, 4_gaps]
