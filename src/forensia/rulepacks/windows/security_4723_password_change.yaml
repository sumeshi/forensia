id: windows-security-4723-password-change
title: User password change attempt (Event 4723)
severity: low
confidence: 0.4
tags:
  - windows
  - account-management
  - credential-abuse
attack:
  - T1098
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user
  FROM evtx_events
  WHERE event_id = 4723
finding:
  title: "Password change by the account owner: {target_user} @ {computer}"
  summary: "A password change attempt (4723) for account '{target_user}' by {subject_user} was observed on {computer} at {timestamp}. Distinguish between a normal self-service password change and suspicious credential replacement after account takeover; pay attention to unusual hours or accounts not recently seen."
