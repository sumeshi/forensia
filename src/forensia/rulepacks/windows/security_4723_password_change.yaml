id: windows-security-4723-password-change
title: User password change attempt (Event 4723)
severity: low
confidence: 0.4
tags:
  - windows
  - account-management
  - credential-abuse
attack:
  - T1098
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user
  FROM evtx_events
  WHERE event_id = 4723
finding:
  title: "本人によるパスワード変更: {target_user} @ {computer}"
  summary: "{timestamp} に {computer} で {subject_user} によるアカウント '{target_user}' のパスワード変更試行(4723)を確認。対象本人の通常操作か、乗っ取り後の資格情報変更か確認する。"
