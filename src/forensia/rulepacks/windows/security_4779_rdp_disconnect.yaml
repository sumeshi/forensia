id: windows-security-4779-rdp-disconnect
title: RDP session disconnect without logoff (Event 4779)
severity: low
confidence: 0.4
tags:
  - windows
  - rdp
attack:
  - T1021.001
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      src_ip
  FROM evtx_events
  WHERE event_id = 4779
finding:
  title: "RDPセッション切断(ログオフなし): {target_user} @ {computer}"
  summary: "{timestamp} に {target_user} が {computer} のRDPセッションを切断(4779)。送信元IP: {src_ip}。再接続(4778)が続く場合は横展開の証拠になりうる。"
