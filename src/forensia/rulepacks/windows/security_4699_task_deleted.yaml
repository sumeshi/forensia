id: windows-security-4699-task-deleted
title: Scheduled task deleted (Event 4699)
severity: medium
confidence: 0.65
tags:
  - windows
  - anti-forensics
  - scheduled-task
attack:
  - T1070.004
  - T1053.005
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user,
      message
  FROM evtx_events
  WHERE event_id = 4699
finding:
  title: "Scheduled task deleted: {computer} ({subject_user})"
  summary: "{subject_user} deleted a scheduled task on {computer} at {timestamp}. This may indicate anti-forensics; compare with 4698 to identify suspicious create-then-delete task cycles."
