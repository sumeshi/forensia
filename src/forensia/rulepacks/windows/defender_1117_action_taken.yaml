id: windows-defender-1117-action-taken
title: Windows Defender action taken (Event 1117)
severity: medium
confidence: 0.6
tags:
  - windows
  - defender
  - malware
attack:
  - T1204.002
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      message
  FROM evtx_events
  WHERE event_id = 1117
finding:
  title: "Defender threat action taken: {computer}"
  summary: "Windows Defender took threat response action on {computer} at {timestamp} (1117). User: {target_user}. Details: {message}. Correlate with 1116 and 5001 to understand activity before and after the infection."
