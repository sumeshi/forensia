id: windows-security-4756-universal-group-added
title: User added to universal security group (Event 4756)
severity: high
confidence: 0.7
tags:
  - windows
  - account-management
  - privilege-escalation
attack:
  - T1098
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user,
      message
  FROM evtx_events
  WHERE event_id = 4756
finding:
  title: "Added to a universal security group: {target_user} @ {computer}"
  summary: "{subject_user} added account '{target_user}' to a universal security group on {computer} at {timestamp} (4756). This may indicate cross-domain privilege expansion."
