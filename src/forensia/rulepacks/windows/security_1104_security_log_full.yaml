id: windows-security-1104-security-log-full
title: Security log full (Event 1104)
severity: medium
confidence: 0.6
tags:
- windows
- log-management
- security-log
attack:
- tactic: defense-evasion
  technique_id: T1562.001
  technique_name: Disable or Modify Tools
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    subject_user,\n    message\nFROM evtx_events\nWHERE event_id = 1104\n"
finding:
  title: 'Security log full: {computer}'
  summary: Security log full event (1104) was observed on {computer} at {timestamp}. New audit events may be lost; review retention settings and any heavy event volume immediately beforehand.
