id: windows-corr-defender-disabled-then-exec
title: Defender disabled followed by suspicious execution within 60 minutes
severity: critical
confidence: 0.85
tags:
  - windows
  - correlation
  - defender
  - execution
attack:
  - T1562.001
  - T1059
query: |
  WITH disabled AS (
      SELECT
          timestamp AS disabled_time,
          computer,
          target_user
      FROM evtx_events
      WHERE event_id = 5001
  ),
  suspicious_exec AS (
      SELECT
          timestamp AS exec_time,
          computer,
          target_user,
          process_name,
          command_line
      FROM evtx_events
      WHERE event_id = 4688
        AND (
          LOWER(COALESCE(process_name, '')) LIKE '%powershell.exe'
          OR LOWER(COALESCE(process_name, '')) LIKE '%pwsh.exe'
          OR LOWER(COALESCE(process_name, '')) LIKE '%\cmd.exe'
          OR LOWER(COALESCE(process_name, '')) LIKE '%\certutil.exe'
          OR LOWER(COALESCE(process_name, '')) LIKE '%\bitsadmin.exe'
          OR LOWER(COALESCE(process_name, '')) LIKE '%\mshta.exe'
          OR LOWER(COALESCE(process_name, '')) LIKE '%\rundll32.exe'
          OR LOWER(COALESCE(process_name, '')) LIKE '%\regsvr32.exe'
          OR LOWER(COALESCE(process_name, '')) LIKE '%\schtasks.exe'
          OR LOWER(COALESCE(process_name, '')) LIKE '%\sc.exe'
        )
  )
  SELECT
      d.computer,
      d.target_user,
      d.disabled_time,
      s.exec_time,
      s.process_name,
      s.command_line
  FROM disabled d
  JOIN suspicious_exec s
    ON d.computer = s.computer
   AND s.exec_time BETWEEN d.disabled_time AND d.disabled_time + INTERVAL 60 MINUTE
finding:
  title: "Suspicious execution after Defender disablement: {computer}"
  summary: "After Defender real-time protection was disabled on {computer} at {disabled_time}, {process_name} executed at {exec_time}. Command line: {command_line}. This strongly suggests defense evasion immediately preceding malware execution."
hypotheses:
  - id: defense_evasion_then_execution
    segment: defense-evasion
    description: "Defender disabled on {computer} followed by {process_name} execution indicates defense evasion preceding malicious activity"
    required_entities: [computer, target_user, process_name]
    confirm_when:
      co_observed_event_ids: [5001, 4688]
      same_host: true
      within_minutes: 60
    refute_when:
      zero_rows: true
    follow_up_questions:
      - "What was the full command line executed on {computer} after Defender was disabled?"
      - "Was the executed {process_name} on {computer} signed or unsigned?"
      - "Were there network connections initiated by {process_name} on {computer}?"
    report_sections: [3_technical, 4_gaps]
