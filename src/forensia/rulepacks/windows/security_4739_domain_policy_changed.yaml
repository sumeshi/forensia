id: windows-security-4739-domain-policy-changed
title: Domain policy changed (Event 4739)
severity: high
confidence: 0.8
required_fields:
  - subject_user
  - computer
  - message
tags:
  - windows
  - policy
  - defense-evasion
attack:
  - T1078
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      subject_user,
      message
  FROM evtx_events
  WHERE event_id = 4739
finding:
  title: "Domain policy changed on {computer}"
  summary: "{subject_user} changed domain policy on {computer} at {timestamp}. Details: {message}. Domain-wide security controls may have been modified to evade detection."