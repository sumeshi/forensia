id: windows-security-4733-local-group-member-removed
title: Member removed from security-enabled local group
severity: high
confidence: 0.75
required_fields:
  - subject_user
  - target_user
  - computer
tags:
  - windows
  - account-management
  - defense-evasion
attack:
  - T1078
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user,
      message
  FROM evtx_events
  WHERE event_id = 4733
finding:
  title: "Removed from local group: {target_user} @ {computer}"
  summary: "{subject_user} removed account '{target_user}' from a security-enabled local group on {computer} at {timestamp}. May indicate attempts to remove accounts from groups."