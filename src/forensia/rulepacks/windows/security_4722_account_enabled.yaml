id: windows-security-4722-account-enabled
title: User account enabled (Event 4722)
severity: medium
confidence: 0.6
tags:
  - windows
  - account-management
attack:
  - T1098
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user
  FROM evtx_events
  WHERE event_id = 4722
finding:
  title: "Account enabled: {target_user} @ {computer}"
  summary: "{subject_user} enabled account '{target_user}' on {computer} at {timestamp} (4722). This may indicate reuse of a previously disabled account or reactivation of a backdoor account."
