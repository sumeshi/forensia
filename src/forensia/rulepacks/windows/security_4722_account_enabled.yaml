id: windows-security-4722-account-enabled
title: Account enabled
severity: medium
confidence: 0.7
required_fields:
  - subject_user
  - target_user
  - computer
tags:
  - windows
  - account-management
  - privilege-escalation
attack:
  - T1078
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user
  FROM evtx_events
  WHERE event_id = 4722
finding:
  title: "Account enabled: {target_user} @ {computer}"
  summary: "{subject_user} enabled account '{target_user}' on {computer} at {timestamp}. Attackers may enable dormant or disabled accounts for persistence."