id: windows-system-39-session-disconnected
title: Session disconnected (RDP)
severity: medium
confidence: 0.6
required_fields:
- computer
- session_id
- reason
tags:
- windows
- rdp
- defense-evasion
attack:
- tactic: lateral-movement
  technique_id: T1021.001
  technique_name: Remote Desktop Protocol
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    session_id,\n    reason\nFROM evtx_events\nWHERE event_id = 39\n  AND LOWER(COALESCE(channel, '')) LIKE '%LocalSessionManager%'\n"
finding:
  title: RDP session disconnected on {computer}
  summary: 'RDP session {session_id} was disconnected on {computer} at {timestamp}. Reason: {reason}. May indicate session hijacking or forced disconnection.'
