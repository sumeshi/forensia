id: windows-security-4647-logoff-started
title: User logoff started
severity: low
confidence: 0.5
required_fields:
  - target_user
  - computer
tags:
  - windows
  - logon
  - user-activity
attack:
  - T1078
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user
  FROM evtx_events
  WHERE event_id = 4647
finding:
  title: "Logoff started for {target_user}"
  summary: "Logoff process started for {target_user} on {computer} at {timestamp}. Part of session lifecycle - correlate with 4634 for completion."