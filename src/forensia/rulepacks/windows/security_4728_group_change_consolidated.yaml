id: windows-security-4728-group-change
title: Security group membership changes (Add, Remove, Modify, Delete)
severity: high
confidence: 0.75
required_fields:
- target_user
- computer
- subject_user
- event_id
- message
tags:
- windows
- group-management
- privilege-escalation
- account-management
attack:
- tactic: persistence
  technique_id: T1098
  technique_name: Account Manipulation
- tactic: privilege-escalation
  technique_id: T1078
  technique_name: Valid Accounts
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    event_id,\n    target_user,\n    subject_user,\n    message\nFROM evtx_events\nWHERE event_id IN (4728, 4729, 4730, 4732, 4733, 4734, 4735, 4737, 4738)\n"
finding:
  title: Group membership change on ${computer}
  summary: Event ${event_id} — account ${target_user} modified by ${subject_user} on ${computer}
hypotheses:
- id: windows-security-4728-privilege-escalation
  segment: privilege-escalation
  description: Account ${target_user} was added to a privileged group (4728/4732/4756) by ${subject_user} on ${computer}, indicating privilege escalation
  required_entities:
  - computer
  - target_user
  - subject_user
  confirm_when:
    co_observed_event_ids:
    - 4728
    - 4732
    - 4756
  refute_when:
    zero_rows: true
  follow_up_questions:
  - Was the target account subsequently used for logon (4624)?
  - Was the adding account compromised?
  report_sections:
  - 3_technical
  - 4_gaps
correlate_with:
- event_ids:
  - 4720
  - 4624
  rationale: account created then added to group, or group member logon
