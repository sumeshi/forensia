id: windows-security-1102-log-cleared
title: Security audit log cleared (Event 1102)
severity: critical
confidence: 0.95
tags:
  - windows
  - anti-forensics
  - log-tampering
attack:
  - T1070.001
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user
  FROM evtx_events
  WHERE event_id = 1102
finding:
  title: "[CRITICAL] Security log cleared: {computer} ({subject_user})"
  summary: "{subject_user} cleared the Security event log on {computer} at {timestamp} (1102). Log reliability is now compromised, and events before this point may be missing, which impacts confidence in the overall investigation."
