id: windows-ntlm-4031-forwarded-auth
title: NTLM forwarded authentication
severity: high
confidence: 0.75
required_fields:
- computer
- target_user
- src_ip
tags:
- windows
- ntlm
- relay-attack
attack:
- tactic: execution
  technique_id: T1559
  technique_name: Inter-Process Communication
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    target_user,\n    src_ip\nFROM evtx_events\nWHERE event_id = 4031\n  AND channel LIKE '%NTLM%'\n"
finding:
  title: NTLM forwarded auth on {computer}
  summary: 'NTLM authentication was forwarded on {computer} at {timestamp}. User: {target_user}, Source IP: {src_ip}. This may indicate NTLM relay attacks or cross-forest authentication.'
