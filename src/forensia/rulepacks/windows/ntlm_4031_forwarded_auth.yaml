id: windows-ntlm-4023-forwarded-auth
title: NTLM forwarded authentication
severity: high
confidence: 0.75
required_fields:
  - computer
  - target_user
  - src_ip
tags:
  - windows
  - ntlm
  - relay-attack
attack:
  - T1559
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      src_ip
  FROM evtx_events
  WHERE event_id = 4031
    AND channel LIKE '%NTLM%'
finding:
  title: "NTLM forwarded auth on {computer}"
  summary: "NTLM authentication was forwarded on {computer} at {timestamp}. User: {target_user}, Source IP: {src_ip}. This may indicate NTLM relay attacks or cross-forest authentication."