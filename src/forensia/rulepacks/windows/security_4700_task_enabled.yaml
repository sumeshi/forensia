id: windows-security-4700-task-enabled
title: Scheduled task enabled
severity: medium
confidence: 0.65
required_fields:
- subject_user
- computer
- task_name
tags:
- windows
- scheduled-task
- persistence
attack:
- tactic: persistence
  technique_id: T1053
  technique_name: Scheduled Task/Job
query: "SELECT\n    evidence_id,\n    timestamp,\n    computer,\n    task_name,\n    subject_user\nFROM evtx_events\nWHERE event_id = 4700\n"
finding:
  title: 'Task enabled: {task_name} @ {computer}'
  summary: Scheduled task '{task_name}' was enabled on {computer} at {timestamp} by {subject_user}. Attackers use task enabling for persistence activation.
