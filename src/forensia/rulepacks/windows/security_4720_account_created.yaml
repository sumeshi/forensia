id: windows-security-4720-account-created
title: User account created (Event 4720)
severity: high
confidence: 0.75
required_fields:
  - subject_user
  - target_user
  - computer
tags:
  - windows
  - account-management
  - persistence
attack:
  - T1136.001
query: |
  SELECT
      evidence_id,
      timestamp,
      computer,
      target_user,
      subject_user
  FROM evtx_events
  WHERE event_id = 4720
finding:
  title: "Account created: {target_user} (creator: {subject_user}) @ {computer}"
  summary: "{subject_user} created the new account '{target_user}' on {computer} at {timestamp}. This may indicate attacker-created backdoor access; check for subsequent Administrators group additions such as 4732."
