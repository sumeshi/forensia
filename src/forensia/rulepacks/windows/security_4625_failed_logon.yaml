id: windows-security-4625-failed-logon
title: Failed logon attempts (grouped by IP)
severity: medium
confidence: 0.6
tags:
  - windows
  - logon
  - brute-force
attack:
  - T1110
query: |
  WITH filtered AS (
      SELECT
          src_ip,
          computer,
          target_user,
          timestamp,
          TIME_BUCKET(INTERVAL '15 minutes', timestamp) AS window_start
      FROM evtx_events
      WHERE event_id = 4625
        AND src_ip IS NOT NULL
        AND TRIM(src_ip) NOT IN ('', '-', '::1', '127.0.0.1')
        AND TRIM(src_ip) NOT LIKE '::ffff:127.%'
  )
  SELECT
      src_ip,
      computer,
      target_user,
      COUNT(*) AS fail_count,
      MIN(timestamp) AS first_seen,
      MAX(timestamp) AS last_seen
  FROM filtered
  GROUP BY src_ip, computer, target_user, window_start
  HAVING COUNT(*) >= 5
  ORDER BY fail_count DESC, last_seen DESC
finding:
  title: "Repeated failed logons: {src_ip} -> {computer} ({target_user})"
  summary: "{fail_count} failed logons from {src_ip} against {target_user} on {computer} were observed from {first_seen} to {last_seen}. This may indicate brute-force activity or password spraying."
