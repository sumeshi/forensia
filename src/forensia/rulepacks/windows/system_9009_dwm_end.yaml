id: windows-system-9009-dwm-end
title: Desktop Window Manager ended (RDP disconnect)
severity: low
confidence: 0.4
required_fields:
- computer
tags:
- windows
- rdp
- system
attack:
- tactic: lateral-movement
  technique_id: T1021.001
