id: leakage-mft-archive-staging-file
title: Archive or staging file observed in user path
severity: high
confidence: 0.6
required_fields:
- file_name
- file_path
query: "SELECT\n    evidence_id,\n    file_name,\n    file_path,\n    extension,\n    si_created,\n    si_modified\nFROM mft_entries\nWHERE\n    extension IN ('zip', '7z', 'rar')\n    AND (\n        LOWER(file_path) LIKE '%/desktop/%' OR\n        LOWER(file_path) LIKE '%/documents/%' OR\n        LOWER(file_path) LIKE '%/downloads/%' OR\n        LOWER(file_path) LIKE '%/temp/%'\n    )\n"
finding:
  title: 'Archive file observed: {file_name}'
  summary: An archive file ({extension}) was observed at {file_path}. This may represent data staging or bundling for transfer; correlate with nearby file access and cloud or removable-media artifacts.
tags:
- leakage
- staging
- archive
attack:
- tactic: exfiltration
  technique_id: T1020
  technique_name: Automated Exfiltration
