schema_version: 2
description: >
  Semantic QuestionSpec registry for reusable report questions. Report templates
  may change wording, order, or language; section_agent resolves each block to
  one of these stable contracts before gathering evidence.

question_types:
  - name: prefetch_recent
    answer_spec: application_execution_history
    intent: "List observed application execution history from Prefetch, with MFT Prefetch fallback when parsed Prefetch rows are unavailable."
    keywords:
      - prefetch
      - application execution
      - application history
      - execution history
      - executed applications
      - アプリケーション実行
      - 実行履歴
      - プリフェッチ
    keypoints:
      - timeline_prefetch_history
      - mft_prefetch_filenames
      - host_execution_activity
    required_fields: [executable_name]
    render_columns: [executable_name, exec_count, last_exec_time, executable_path, prefetch_file, prefetch_records, artifact_time, artifact_path, evidence_id, source_file]
    interpretation_template: "実行履歴は {row_count} 行あり、代表例は {sample(executable_name, 4)} です。Prefetch は実行の存在を示しますが、操作目的や対象ファイルは別証跡との相関が必要です。"
    status_rules:
      min_rows_for_answer: 1
      empty_status: not_found
      empty_reason: "No Prefetch execution rows or Prefetch file artifacts were found."
    expected_answer_shape:
      format: list
      fields: [executable_name, exec_count, last_exec_time, executable_path, prefetch_file, prefetch_records]
      style: versioned_list
      note: "For applications found in Prefetch, include version if available from MFT file_path."

    evidence_chain:
      - source: prefetch_executions
        query: "SELECT executable_name, SUM(exec_count) AS exec_count, MAX(last_exec_time) AS last_exec_time, COUNT(*) AS prefetch_records, MIN(COALESCE((SELECT MIN(x.executable_path) FROM (SELECT UNNEST(TRY_CAST(filenames AS VARCHAR[])) AS executable_path) x WHERE x.executable_path LIKE '%' || UPPER(executable_name)), source_file)) AS executable_path, MIN(source_file) AS prefetch_file FROM prefetch_executions GROUP BY executable_name"
      - source: mft_entries
        query: "SELECT file_name, si_modified, file_path FROM mft_entries WHERE file_path LIKE '%/Prefetch/%' AND file_name LIKE '%.pf'"
        # condition: "when prefetch_executions empty" — fallthrough on empty is handled by code

  - name: email_application
    answer_spec: email_application_usage
    builder_policy: generic
    intent: "Identify mail client applications from mail data files and application artifacts."
    keywords:
      - e-mail application
      - email application
      - mail application
      - mail client
      - e-mail communication
      - email communication
      - mail communication
      - メールアプリ
      - メールクライアント
      - 電子メールアプリケーション
    keypoints:
      - structured_email_artifacts
      - mft_outlook_artifacts
      - ioc_email_ost_files
      - mft_user_app_activity
    interpretation_template: "メール関連痕跡は {sample(application_name, 3)} を中心に確認されています。OST/PST はメールデータ参照の可能性を示しますが、内容閲覧や外部送信までは直接示しません。"
    required_fields: [application_name]
    render_columns: [application_name, version, evidence_type, artifact_path, artifact_time, evidence_id]
    status_rules:
      min_rows_for_answer: 1
      empty_status: not_found
    expected_answer_shape:
      format: name_with_version
      fields: [application_name, version, data_files]
      style: versioned_list
      note: "Identify the mail client application from mail data files and application artifacts."
    evidence_chain:
      - source: mft_entries
        query: "SELECT {{catalog_label_sql:email_artifacts:client:exe_patterns,paths,data_files:file_name,file_path:application_name}}, '' AS version, 'mft' AS evidence_type, file_path AS artifact_path, si_modified AS artifact_time, evidence_id FROM mft_entries WHERE {{catalog_data_file_sql:email_artifacts:file_name}} OR {{catalog_path_sql:email_artifacts:file_path}}"

  - name: email_ost
    answer_spec: email_data_files
    builder_policy: generic
    intent: "List observed mail data files such as OST/PST/MBOX and their filesystem timestamps."
    keywords:
      - ost
      - pst
      - mail
      - email
      - outlook
      - email data
      - mail data
      - メールデータ
      - メールファイル
      - ostファイル
      - pstファイル
    keypoints:
      - structured_email_artifacts
      - mft_outlook_artifacts
      - ioc_email_ost_files
      - mft_user_app_activity
    interpretation_template: "メールデータファイルは {row_count} 件、代表は {sample(file_name, 3)} です。OST/PST の存在はメールクライアント利用を示しますが、実際の送受信内容はクライアントログやネットワーク証跡で確認してください。"
    required_fields: [file_path]
    render_columns: [file_name, file_path, extension, si_created, si_modified, si_accessed, fn_created, fn_modified, fn_accessed, evidence_id]
    status_rules:
      min_rows_for_answer: 1
      empty_status: not_found
    expected_answer_shape:
      format: name_with_version
      fields: [application_name, version, data_files]
      style: versioned_list
      note: "OST files ALWAYS imply Microsoft Outlook. Report as 'Microsoft Outlook 2013' (or version from MFT)."

    evidence_chain:
      - source: mft
        query: "SELECT file_name, file_path, extension, si_created, si_modified, si_accessed, fn_created, fn_modified, fn_accessed, evidence_id FROM mft_entries WHERE {{catalog_extension_sql:email_artifacts:extension}} OR {{catalog_data_file_sql:email_artifacts:file_name}} ORDER BY COALESCE(fn_modified, si_modified, fn_created, si_created) DESC NULLS LAST, file_path LIMIT 100"

  - name: desktop_rename
    answer_spec: desktop_rename_candidates
    intent: "Identify likely desktop or Recent-file rename pairs with timestamps and evidence basis."
    keywords:
      - desktop
      - recent
      - rename
      - file name
      - file rename
      - リネーム
      - 名前変更
      - デスクトップファイル
    keypoints:
      - structured_desktop_rename_candidates
      - mft_recent_folder_lnk
      - mft_user_desktop_artifacts
    interpretation_template: "リネーム候補は {row_count} 件です。Recent LNK 由来の推定はユーザー操作の手掛かりになりますが、実ファイル名変更の直接証跡としては慎重に扱います。"
    required_fields: [original_name, new_name]
    render_columns: [original_name, new_name, timestamp, basis, source_paths, evidence_ids]
    status_rules:
      min_rows_for_answer: 1
      empty_status: not_found
    expected_answer_shape:
      format: pair_list
      fields: [original_name, new_name, timestamp]
      style: table
      note: "Report renamed files as original→new pairs with timestamps from MFT $FILE_NAME attributes."

    evidence_chain:
      - source: mft_entries
        query: "SELECT file_name, file_path, si_modified FROM mft_entries WHERE file_path LIKE '%/Desktop/%' AND (file_name LIKE '%~%.%' OR file_name LIKE '%(%.%')"
      - source: mft_entries
        query: "SELECT file_name, json_extract_string(raw_json, '$.attributes.FileName.data.name') AS original_name, si_modified FROM mft_entries WHERE json_extract_string(raw_json, '$.attributes.FileName.data.name') IS NOT NULL AND json_extract_string(raw_json, '$.attributes.FileName.data.name') != file_name"

  - name: topic_file_timestamps
    answer_spec: resignation_file_timestamps
    builder_policy: generic
    intent: "List filesystem timestamps for files matching the topic keywords supplied by an external evaluation/template question."
    keywords:
      - resignation
      - resign
      - retire
      - resignation letter
      - retirement
      - 退職
      - 辞職
    keypoints:
      - structured_resignation_files
    interpretation_template: "対象 topic に一致するファイルは {row_count} 件、代表は {sample(file_name, 3)} です。この keyword は evaluation/template 側の設問語彙であり、ファイル内容や意図までは別証跡で確認してください。"
    required_fields: [file_name]
    render_columns: [file_name, file_path, extension, is_deleted, si_created, si_modified, si_accessed, fn_created, fn_modified, fn_accessed, evidence_id]
    status_rules:
      min_rows_for_answer: 1
      empty_status: not_found
      empty_reason: "No files matched the declared topic keywords."
    expected_answer_shape:
      format: table
      fields: [file_name, file_path, extension, si_created, si_modified, si_accessed, fn_created, fn_modified, fn_accessed]
      style: table
      note: "Keyword-specific file timestamp questions should be represented in template/question routing, not core Python builders."
    evidence_chain:
      - source: mft_topic_keyword_files
        query: "SELECT file_name, file_path, extension, is_deleted, si_created, si_modified, si_accessed, fn_created, fn_modified, fn_accessed, evidence_id FROM mft_entries WHERE LOWER(COALESCE(file_name, '')) LIKE '%resign%' OR LOWER(COALESCE(file_name, '')) LIKE '%resignation%' OR LOWER(COALESCE(file_name, '')) LIKE '%retire%' OR LOWER(COALESCE(file_path, '')) LIKE '%resign%' OR LOWER(COALESCE(file_path, '')) LIKE '%resignation%' OR LOWER(COALESCE(file_path, '')) LIKE '%retire%' ORDER BY COALESCE(fn_modified, si_modified, fn_created, si_created) DESC NULLS LAST, file_path LIMIT 100"

  - name: browser_usage
    answer_spec: browser_usage
    intent: "Identify browser applications observed through Prefetch and filesystem artifacts."
    timeline: true
    keywords:
      - browser
      - chrome
      - edge
      - firefox
      - web
      - web browser
      - ブラウザ
      - Webブラウザ
    keypoints:
      - structured_browser_artifacts
      - host_execution_activity
      - mft_user_app_activity
    interpretation_template: "ブラウザ痕跡として {sample(browser_name, 4)} が確認できます。Web利用の存在は示しますが、アクセス先や送信内容は履歴・キャッシュ・ネットワーク証跡で補完してください。"
    required_fields: [browser_name]
    render_columns: [browser_name, prefetch_records, total_exec_count, last_exec_time, mft_artifacts, first_artifact_time, last_artifact_time, sample_paths, evidence_ids]
    status_rules:
      min_rows_for_answer: 1
      empty_status: not_found
    expected_answer_shape:
      format: name_with_version
      fields: [application_name, version]
      style: versioned_list
      note: "Include version when available from MFT file_path of the browser executable. Browser product names are supplied by dfir_ioc_catalog.yaml."

    evidence_chain:
      - source: mft_entries
        query: "SELECT file_name, file_path, si_modified FROM mft_entries WHERE ({{catalog_path_sql:browser_artifacts:file_path}}) AND {{catalog_exe_sql:browser_artifacts:file_name}}"
      - source: prefetch_executions
        query: "SELECT executable_name, exec_count, last_exec_time FROM prefetch_executions WHERE {{catalog_exe_sql:browser_artifacts:executable_name}}"

  - name: logon_history
    answer_spec: daily_session_activity
    intent: "Summarize startup, shutdown, logon, and logoff activity by calendar date."
    timeline: true
    keywords:
      - logon
      - logoff
      - shutdown
      - startup
      - session activity
      - ログオン履歴
      - シャットダウン履歴
      - 起動履歴
      - セッション履歴
      - 日別
      - 起動
      - ログオフ
    keypoints:
      - session_activity_events
      - structured_daily_session_activity
      - system_shutdown_events
      - system_startup_events
      - interactive_logon_events
      - logoff_events
    interpretation_template: "日別セッション活動は {first.date} から {last.date} まで {row_count} 日分確認できます。起動・ログオン・シャットダウンのパターンから、通常稼働期間と異常を評価します。"
    required_fields: [date]
    render_columns: [date, startup, logons, logoff, shutdown]
    status_rules:
      min_rows_for_answer: 1
      empty_status: not_found
    expected_answer_shape:
      format: daily_table
      fields: [date, startup, logons, logoff, shutdown]
      style: table
      note: "Group by calendar date. Each row has date, startup count, logon count, logoff count, shutdown count."

    evidence_chain:
      - source: evtx_events
        query: "SELECT event_id, timestamp, computer, user_name, logon_type FROM evtx_events WHERE event_id IN (6005, 6006, 6008, 4624, 4634, 4647, 4776) ORDER BY timestamp"

  - name: daily_session_timeline
    answer_spec: daily_session_timeline
    intent: "Per-day session timeline showing first startup, first logon, last logoff, last shutdown, logon users, and interactive logon count."
    timeline: true
    keywords:
      - startup/shutdown traces
      - startup shutdown
      - logon/logoff history
      - logon logoff history
      - session timeline
      - session history
      - first startup
      - first logon
      - last logoff
      - last shutdown
      - daily session
      - 起動/シャットダウン
      - ログオン/ログオフ履歴
      - セッションタイムライン
      - 起動時刻
      - シャットダウン時刻
    keypoints:
      - session_activity_events
      - structured_daily_session_activity
      - system_shutdown_events
      - system_startup_events
      - interactive_logon_events
      - logoff_events
    interpretation_template: "セッションタイムラインは {row_count} 日分あります。日ごとの最初の起動・ログオン、最後のログオフ・シャットダウン時刻から、システム稼働パターンを確認できます。"
    required_fields: [date, first_startup]
    render_columns: [date, first_startup, first_logon, last_logoff, last_shutdown, logon_users, interactive_logon_count]
    status_rules:
      min_rows_for_answer: 1
      empty_status: not_found
    expected_answer_shape:
      format: daily_session_timeline
      fields: [date, first_startup, first_logon, last_logoff, last_shutdown, logon_users, interactive_logon_count]
      style: table
      note: "One row per calendar date with actual timestamps of first startup, first interactive logon, last logoff, and last shutdown events."

  - name: cloud_activity
    answer_spec: cloud_service_traces
    intent: "Enumerate cloud sync services and whether executable, path, or configuration artifacts were observed."
    keywords:
      - cloud
      - drive
      - icloud
      - onedrive
      - dropbox
      - cloud service
      - クラウド
      - クラウドサービス
      - 同期サービス
    keypoints:
      - structured_cloud_artifacts
      - host_execution_activity
      - mft_cloud_sync_artifacts
    interpretation_template: "クラウドサービス痕跡として {sample(service_name, 4)} が確認できます。同期環境の存在は示しますが、同期対象と完了可否はクライアントDBやログの追加確認が必要です。"
    required_fields: [service_name]
    render_columns: [service_name, exe_found, paths_found, config_found, evidence_ids]
    status_rules:
      min_rows_for_answer: 1
      empty_status: not_found
    expected_answer_shape:
      format: enumerated_services
      fields: [service_name, exe_found, paths_found, config_found]
      style: table
      note: "Enumerate all cloud services declared in dfir_ioc_catalog.yaml. For each, report whether executable/path/config files were found."

    evidence_chain:
      - source: mft_entries
        query: "SELECT file_name, file_path, si_modified FROM mft_entries WHERE {{catalog_path_sql:cloud_sync_artifacts:file_path}}"
      - source: prefetch_executions
        query: "SELECT executable_name, exec_count, last_exec_time FROM prefetch_executions WHERE {{catalog_exe_sql:cloud_sync_artifacts:executable_name}}"
      - source: mft_entries
        query: "SELECT file_name, file_path, si_modified FROM mft_entries WHERE {{catalog_file_sql:cloud_sync_artifacts:paths:file_name}}"

  - name: antiforensics
    answer_spec: antiforensic_activity
    intent: "Scan for anti-forensic activity, event log clearing, and known cleanup tool artifacts."
    timeline: true
    keywords:
      - wipe
      - delete
      - clean
      - log clear
      - log clearing
      - anti-forensic
      - antiforensic
      - 証拠隠滅
      - ログ削除
      - ログ消去
    keypoints:
      - structured_antiforensics
      - timeline_system_events
      - system_shutdown_events
    required_fields: [evidence_type]
    interpretation_template: "反フォレンジック候補は {sample(evidence_type, 4)} として {row_count} 行あります。ツールの存在と実行は重要ですが、削除対象や実行内容は別証拠で確認します。"
    render_columns: [evidence_type, timestamp, event_id, channel, computer, target_user, file_name, file_path, is_deleted, si_created, si_modified, evidence_id, message]
    status_rules:
      min_rows_for_answer: 1
      empty_status: not_found
    expected_answer_shape:
      format: full_scan
      fields: [tool_name, evidence_type, found, details]
      style: table
      note: "Scan all antiforensic tools declared in dfir_ioc_catalog.yaml. Report log clearing events (104, 1102). Report Recycle Bin emptying."

    evidence_chain:
      - source: evtx_events
        query: "SELECT event_id, timestamp, computer FROM evtx_events WHERE event_id IN (104, 1102, 1100)"
      - source: mft_entries
        query: "SELECT file_name, file_path, si_modified FROM mft_entries WHERE {{catalog_exe_sql:antiforensic_tools:file_name}} OR {{catalog_artifact_sql:antiforensic_tools:file_name}}"
      - source: mft_entries
        query: "SELECT file_name, file_path, is_deleted FROM mft_entries WHERE is_deleted = 1 AND {{catalog_file_sql:cloud_sync_artifacts:paths:file_name}}"

  - name: host_identity
    answer_spec: host_identity
    intent: "List observed host or computer identities in the evidence."
    keywords:
      - computer name
      - host name
      - host identity
      - endpoint identity
      - computer
      - コンピュータ名
      - ホスト名
      - 端末名
    keypoints:
      - overview_hosts
    interpretation_template: "EVTX 上では {sample(host_id, 3)} が観測されています。以降の判断では、主要ホストと少数ホストを分け、同一端末名の表記揺れも考慮します。"
    required_fields: [host_id]
    render_columns: [host_id, evidence_count, first_seen, last_seen]
    status_rules:
      min_rows_for_answer: 1
      empty_status: not_found
    expected_answer_shape:
      format: list
      fields: [host_id]
      style: list
    evidence_chain:
      - source: evtx_events
        query: "SELECT DISTINCT computer FROM evtx_events WHERE computer IS NOT NULL"

  - name: case_event_window
    answer_spec: case_event_window
    intent: "Return the earliest and latest observed event timestamps for the case."
    keywords:
      - event window
      - evidence window
      - time range
      - case time range
      - investigation window
      - 調査期間
      - 証拠期間
      - イベント期間
    keypoints:
      - overview_event_range
    required_fields: [first_event, last_event]
    interpretation_template: "証拠期間は {first.first_event} から {first.last_event} まで、合計 {first.event_count} イベントです。"
    render_columns: [first_event, last_event, event_count]
    status_rules:
      min_rows_for_answer: 1
      empty_status: not_found
    expected_answer_shape:
      format: single_row
      fields: [first_event, last_event, event_count]
      style: table
      note: "Report the case evidence time range from event timestamps."
    evidence_chain:
      - source: evtx_events
        query: "SELECT MIN(timestamp) AS first_event, MAX(timestamp) AS last_event, COUNT(*) AS event_count FROM evtx_events"

  - name: host_logons
    answer_spec: last_human_logon
    intent: "Return the latest human-user logon event, preferring interactive logon types when present."
    keywords:
      - last logon
      - logon user
      - last logged-on user
      - last user to log on
      - latest logon
      - most recent logon
      - 最後にログオン
      - 最終ログオン
      - 直近ログオン
      - ログオンしたユーザー
    keypoints:
      - session_activity_events
      - interactive_logon_events
    required_fields: [logon_time, user_name]
    interpretation_template: "最後に確認できる人間ユーザー系ログオンは {first.logon_time} の {first.computer} / {first.user_name} です。これは最終利用者の候補であり、ログオン種別と周辺操作で裏付けます。"
    render_columns: [logon_time, computer, user_name, logon_type, process_name, src_ip, evidence_id]
    status_rules:
      min_rows_for_answer: 1
      empty_status: not_found
    expected_answer_shape:
      format: list
      fields: [logon_time, computer, user_name, logon_type, process_name, src_ip, evidence_id]
      style: table
      note: "Return the latest human-user logon event. Do not return daily aggregate counts."
    evidence_chain:
      - source: evtx_events
        query: "SELECT timestamp AS logon_time, computer, target_user AS user_name, logon_type, process_name, src_ip, evidence_id FROM evtx_events WHERE event_id = 4624 ORDER BY timestamp DESC LIMIT 20"

  - name: accounts_summary
    keywords:
      - account list
      - account summary
    keypoints:
      - account_all_logon_summary
      - account_observed_users
    evidence_chain:
      - source: evtx_events
        query: "SELECT DISTINCT target_user FROM evtx_events WHERE event_id IN (4624, 4720) AND target_user IS NOT NULL"

  - name: investigation_window
    answer_spec: last_shutdown_event
    intent: "Return the latest shutdown-relevant event, not the overall last event in the case."
    keywords:
      - shutdown
      - last shutdown
      - last recorded shutdown
      - shutdown time
      - recorded shutdown
      - startup
      - final shutdown
      - latest shutdown
      - most recent shutdown
      - 最後のシャットダウン
      - 最終シャットダウン
      - 直近シャットダウン
      - シャットダウン時刻
    keypoints:
      - structured_last_shutdown
      - overview_event_range
      - system_shutdown_events
      - system_startup_events
    required_fields: [shutdown_time, event_id]
    interpretation_template: "最後の shutdown/log stop 系イベントは {first.shutdown_time} の Event ID {first.event_id} です。終了時刻の基準として使えますが、意図的停止か通常終了かは周辺イベントで判断します。"
    render_columns: [shutdown_time, event_id, computer, evidence_id, message]
    status_rules:
      min_rows_for_answer: 1
      empty_status: not_found
    expected_answer_shape:
      format: list
      fields: [shutdown_time, event_id, computer, evidence_id]
      style: table
      note: "Return the latest shutdown-relevant event only; do not use the overall last event timestamp."
    evidence_chain:
      - source: evtx_events
        query: "SELECT timestamp, event_id, computer FROM evtx_events WHERE event_id IN (1074, 6005, 6006, 6008, 6013, 7001, 7002) ORDER BY timestamp"
