table: prefetch_timeline
core_columns: [executable_name, exec_time, exec_index, prefetch_hash, evidence_id]
column_descriptions:
  executable_name: "Name of the executed binary (e.g. cmd.exe, chrome.exe)."
  exec_time: "Timestamp of one of the recorded executions. Prefetch records up to 8 per file."
  exec_index: "0 = most recent execution, 1-7 = older history (oldest at 7)."
  prefetch_hash: "32-bit hash used in the Prefetch filename suffix."
  evidence_id: "Stable evidence id linking back to prefetch_executions."
columns:
  - timeline_id
  - evidence_id
  - executable_name
  - prefetch_hash
  - exec_time
  - exec_index
  - source_file
  - tags
notes:
  windowed_query: "Use this table for time-range queries against Prefetch. prefetch_executions only exposes the LATEST execution per binary; prefetch_timeline exposes all 8."
  no_host_column: "prefetch_timeline is a single-host artifact and has NO `computer` / `host` / `user_name` column. Do NOT JOIN with evtx_events on host or user."
  join_pattern: "If correlating with evtx_events by host, filter evtx_events to the host first (WHERE computer = '...') and JOIN prefetch_timeline by exec_time window only — prefetch artifacts are single-host."
