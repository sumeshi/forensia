table: evtx_events
columns:
  - evidence_id
  - source_file
  - channel
  - event_id
  - record_id
  - timestamp
  - computer
  - user_name
  - target_user
  - subject_user
  - src_ip
  - dst_ip
  - dst_port
  - protocol
  - logon_type
  - process_name
  - process_id
  - command_line
  - service_name
  - exception_code
  - object_dn
  - attribute
  - target_server
  - target_group
  - task_name
  - session_id
  - share_name
  - access_mask
  - normalized_src_ip
  - normalized_target_user
  - parent_process
  - parent_process_id
  - parent_cmd
  - child_process
  - child_process_id
  - child_cmd
  - parent_image
  - file_path
  - parent_guid
  - child_guid
  - clear_time
  - clear_event_id
  - first_seen
  - last_seen
  - hour_bucket
  - request_count
  - status
  - reason
  - message
  - raw_json
  - tags
  - severity
notes:
  interactive_logon: "To identify the last logged-on user, query event_id = 4624 AND logon_type IN ('2','10'). Treat 4728/4732 and similar group-management events as account administration, NOT logon evidence."
  entity_normalization: "Treat account names ending with '$' as machine_account, not as user or source_ip. Keep source_ip, source_host, and source_account separate; never store a machine account in source_ip. Label newly_created_user only when account-creation evidence exists (for example 4720/4722) and the user was not already present earlier in the evidence window. Existing observed users should stay observed_user, suspicious_user, actor_candidate, or victim_user unless direct creation evidence says otherwise."
json_field_extractors:
  SubjectUserName: "json_extract(raw_json, '$.SubjectUserName')"
  TargetUserName: "json_extract(raw_json, '$.TargetUserName')"
  TargetDomainName: "json_extract(raw_json, '$.TargetDomainName')"
  IpAddress: "json_extract(raw_json, '$.IpAddress')"
  IpPort: "json_extract(raw_json, '$.IpPort')"
  LogonType: "json_extract(raw_json, '$.LogonType')"
  ProcessName: "json_extract(raw_json, '$.ProcessName')"
  CommandLine: "json_extract(raw_json, '$.CommandLine')"
  ServiceName: "json_extract(raw_json, '$.ServiceName')"
  ServiceFileName: "json_extract(raw_json, '$.ServiceFileName')"