# verdict_taxonomy.yaml
# Central vocabulary for all verdict/status enums across investigation phases.
# Every string value used as verdict/status/stage must appear here.

hypothesis_verdict:
  values:
    - confirmed
    - refuted
    - inconclusive
    - newlead
    - untestable
  description: "Verdict for a hypothesis after query+check phase"

section_verdict:
  values:
    - block_supported
    - block_needs_more
    - block_contradicted
  description: "Verdict from section agent check phase"

structured_status:
  values:
    - answered
    - partial
    - not_found
    - not_searched
    - insufficient_evidence
    - wrong_query
  description: "Status for individual semantic/structured question answers"

question_status:
  values:
    - answered
    - partial
    - not_found
    - not_searched
    - insufficient_evidence
    - wrong_query
  description: "Backward-compatible alias for structured_status"

claim_status:
  values:
    - accepted
    - suppressed
    - pending
  description: "Support status for evidence-backed claims in memory"

mapping:
  hypothesis_to_section:
    confirmed: block_supported
    refuted: block_contradicted
    inconclusive: block_needs_more
    newlead: block_needs_more
    untestable: block_needs_more
  section_to_structured:
    block_supported: answered
    block_needs_more: insufficient_evidence
    block_contradicted: not_found
  structured_to_claim:
    answered: accepted
    partial: pending
    not_found: suppressed
    not_searched: pending
    insufficient_evidence: pending
    wrong_query: pending
  section_to_question:
    block_supported: answered
    block_needs_more: insufficient_evidence
    block_contradicted: not_found
  question_to_claim:
    answered: accepted
    partial: pending
    not_found: suppressed
    not_searched: pending
    insufficient_evidence: pending
    wrong_query: pending
