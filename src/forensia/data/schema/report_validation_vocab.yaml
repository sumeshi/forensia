# Report validation detection vocabulary
# Loaded by report_validation.py — language-agnostic (Rule 16).

intrusion_keywords:
  - intrusion
  - lateral movement
  - lateral-movement
  - remote access
  - network penetration
  - 外部侵入
  - ラテラルムーブメント

path_leak_patterns:
  - "sample/"
  - "/mnt/[a-z]/"

# Fixed phrases emitted by the deterministic narrative fallback. If any of
# these reach the rendered report, a narrator failure was shipped verbatim
# as report prose instead of being summarized (Fail loud, H-2).
fallback_stub_phrases:
  - "the collected evidence returned"
  - "collected evidence returned"
  - "related rows. Representative row:"
  - "could not be summarized automatically"

# Block-failure phrases rendered into section bodies. One vocabulary shared by
# the section quality gate and final report validation.
failure_markers:
  - "Section block failed"
  - "Section could not be generated"
  - "Block skipped"
