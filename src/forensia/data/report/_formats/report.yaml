version: 1

publication:
  ja:
    notice: |-
      > **レポート状態: `needs_review` / `incomplete`**
      > 現行の出力がない節: {missing}。更新が必要な節: {stale}。
      > 解決できない証拠参照がある節: {unresolved}。
      > 未完了の理由: {reasons}。
    audit_notice: |-
      > **監査状態: `needs_review` / `nonpublishable`**
      > レポート出力の完成状態: {case_status}。調査状態: {investigation_status}。
      > 調査停止理由: {stop_reason_code} — {stop_reason}。
      > 証拠の確度: {evidence_confidence}。確認済み仮説: {confirmed} 件。
      > 調査状態の理由: {investigation_reasons}。
      > 公開を妨げる検証: {checks}。
    none: "なし"
    audit_clear: "なし"
    investigation_reason_none: "なし"
    stop_reason_none: "なし"
    case_complete: "complete"
    case_incomplete: "incomplete"
    incomplete_reason: "公開要件が未充足"
  en:
    notice: |-
      > **Report status: `needs_review` / `incomplete`**
      > Sections without current output: {missing}. Sections needing refresh: {stale}.
      > Sections with unresolved evidence references: {unresolved}.
      > Incomplete because: {reasons}.
    audit_notice: |-
      > **Audit status: `needs_review` / `nonpublishable`**
      > Report output completeness: {case_status}. Investigation status: {investigation_status}.
      > Investigation stop reason: {stop_reason_code} — {stop_reason}.
      > Evidence confidence: {evidence_confidence}. Confirmed hypotheses: {confirmed}.
      > Investigation status reasons: {investigation_reasons}.
      > Validation checks blocking publication: {checks}.
    none: "none"
    audit_clear: "none"
    investigation_reason_none: "none"
    stop_reason_none: "none"
    case_complete: "complete"
    case_incomplete: "incomplete"
    incomplete_reason: "publication requirements are incomplete"

narrative_fallback:
  unsupported: "No supporting evidence was found for {heading}. This item is unsupported and is not part of the incident narrative."
  evidence_reference: " (evidence: {ids})"
  finding_reference: " (findings: {ids})"
  observed: "Observed activity relevant to {heading}: {observations}.{reference}"
  insufficient_detail: "Evidence relevant to {heading} was collected, but the available rows do not contain enough report-visible detail for a stronger summary.{reference}"
  partial_suffix: " Additional correlation is needed before this is fully established."

structured_answer:
  max_list_items: 5
  max_cell_chars: 240
  empty_answer: "- no answer"
  truncated_cell_suffix: " ... [truncated]"
  row_preview_note: "_Showing {shown} of {total} rows. Full data is available in the structured JSON/CSV export._"
  not_found_interpretation: "No rows directly matching this question were found. Before concluding 'not found', verify that the ingested logs and time range are sufficient."
  insufficient_interpretation: "Insufficient rows were retrieved for this question. Review the missing reason in the table and determine whether additional evidence exists."
  default_interpretation: "This question has {row_count} rows of structured evidence. The table supports the answer, but evaluate conclusions by correlating time, host, user, and related artifacts.{timezone_basis}"
  headings:
    interpretation: Interpretation
    answer: Answer
    missing_reason: Missing Reason
    queries_run: Queries Run
    structured_data: Structured Data
  labels:
    id: ID
    status: Status
    none: none

gaps:
  cloud_sync:
    gap: Direct evidence of cloud sync destinations and targets
    why_it_matters: Cloud sync client traces show the environment exists but do not directly show sync targets, destinations, or completion status.
    next_step: Correlate sync client logs, local DB, and network logs.
  mailbox:
    gap: Email content and send/receive verification
    why_it_matters: Email data file existence shows client usage but content and attachment movement need other evidence.
    next_step: Correlate email data file analysis results and server-side logs if available.
  antiforensic:
    gap: Scope of wiping tool execution
    why_it_matters: Cleaning tool execution traces are a strong candidate but do not reveal deletion targets or execution details alone.
    next_step: Correlate tool settings, task files, deleted MFT entries, and log stop times.
  network:
    gap: Insufficient normalized network evidence
    why_it_matters: EVTX alone is insufficient to determine external communication.
    next_step: Ingest firewall/proxy/DNS/cloud client logs if available.
