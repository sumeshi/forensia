id: "filesystem-mft-startup-folder-shortcut"
title: "Shortcut recorded in a Startup folder"
severity: medium
confidence: 0.55
required_fields:
- file_name
- file_path
tags:
- filesystem
- mft
- startup-folder
- shortcut
query: "SELECT\n    evidence_id,\n    file_name,\n    file_path,\n    size,\n    si_created,\n    si_modified,\n    fn_created,\n    is_deleted\nFROM mft_entries\nWHERE LOWER(extension) = 'lnk'\n    AND (\n        LOWER(file_path) LIKE '%/start menu/programs/startup/%'\n        OR LOWER(file_path) LIKE '%/start menu/programs/start-up/%'\n    )\n"
finding:
  title: "Startup-folder shortcut: {file_name}"
  summary: "MFT records shortcut {file_name} at {file_path}. A Startup-folder location can cause a shortcut target to run at logon, but this record alone does not show that the target ran or that the shortcut is unwanted."
