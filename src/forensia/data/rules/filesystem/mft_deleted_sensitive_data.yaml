id: "filesystem-mft-deleted-file-type"
title: "Deleted document or archive file observed"
severity: medium
confidence: 0.5
required_fields:
- file_name
- file_path
tags:
- filesystem
- mft
- deletion
query: "SELECT\n    evidence_id,\n    file_name,\n    file_path,\n    extension,\n    size,\n    si_modified,\n    fn_modified,\n    is_deleted\nFROM mft_entries\nWHERE is_deleted = TRUE\n    AND LOWER(extension) IN ('doc', 'docx', 'xls', 'xlsx', 'pdf', 'zip', '7z', 'rar', 'pst', 'ost', 'bak')\n"
finding:
  title: "Deleted document or archive file: {file_name}"
  summary: "MFT marks {file_name} ({extension}) at {file_path} as deleted. File type alone does not establish the content or sensitivity of the data."
