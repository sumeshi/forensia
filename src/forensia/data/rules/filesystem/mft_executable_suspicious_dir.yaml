id: "filesystem-mft-executable-user-path"
title: "Executable recorded in a user-writable path"
severity: "medium"
confidence: 0.6
required_fields:
- file_name
- file_path
tags:
- filesystem
- mft
- executable
query: "SELECT\n    evidence_id,\n    file_name,\n    file_path,\n    extension,\n    size,\n    si_created,\n    si_modified,\n    fn_created,\n    fn_modified,\n    is_deleted\nFROM mft_entries\nWHERE LOWER(extension) IN ('exe', 'dll', 'scr', 'sys', 'com')\n    AND (\n        LOWER(file_path) LIKE '%/temp/%'\n        OR LOWER(file_path) LIKE '%/appdata/%'\n        OR LOWER(file_path) LIKE '%/programdata/%'\n        OR LOWER(file_path) LIKE '%/$recycle.bin/%'\n        OR LOWER(file_path) LIKE '%/users/public/%'\n    )\n"
finding:
  title: "Executable in user-writable path: {file_name}"
  summary: "MFT records executable {file_name} at {file_path}. The path is commonly writable by users; this observation does not establish how the file arrived or whether it ran."
