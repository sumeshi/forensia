id: registry-proxy-enabled
title: "System proxy configuration observed"
severity: low
confidence: 0.5
required_fields:
- key_path
- hive
tags:
- registry
- network-configuration
- proxy
query: "SELECT\n    artifact_id AS evidence_id,\n    key_path,\n    hive,\n    timestamp,\n    json_extract_string(raw_json, '$.reg2es.custom.proxy') AS proxy_server,\n    json_extract_string(raw_json, '$.reg2es.custom.proxypac') AS proxy_pac\nFROM registry_artifacts\nWHERE plugin = 'proxy'\n    AND (\n        LOWER(COALESCE(json_extract_string(raw_json, '$.reg2es.custom.enabled'), '')) IN ('true', '1')\n        OR (\n            json_extract_string(raw_json, '$.reg2es.custom.proxypac') IS NOT NULL\n            AND LOWER(COALESCE(json_extract_string(raw_json, '$.reg2es.custom.proxypac'), '')) NOT IN ('n/a', '', 'none')\n        )\n    )\n"
finding:
  title: "System proxy configuration: {proxy_server}{proxy_pac}"
  summary: "The Registry parser reported proxy server {proxy_server} or auto-config URL {proxy_pac} under {key_path} ({hive}). This records configuration and does not establish that traffic was redirected."
