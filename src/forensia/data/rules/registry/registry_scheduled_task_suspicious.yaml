id: "registry-scheduled-task-command-reference"
title: "Scheduled-task command reference observed"
severity: medium
confidence: 0.55
required_fields:
- key_path
- task_command
- hive
tags:
- registry
- scheduled-task
- configuration
query: "SELECT\n    artifact_id AS evidence_id,\n    key_path,\n    hive,\n    timestamp,\n    json_extract_string(raw_json, '$.reg2es.custom.Path') AS task_path,\n    json_extract_string(raw_json, '$.reg2es.custom.Actions.cmd') AS task_command\nFROM registry_artifacts\nWHERE plugin = 'tasks'\n    AND (\n        LOWER(COALESCE(json_extract_string(raw_json, '$.reg2es.custom.Actions.cmd'), '')) LIKE '%\\temp\\%'\n        OR LOWER(COALESCE(json_extract_string(raw_json, '$.reg2es.custom.Actions.cmd'), '')) LIKE '%\\appdata\\%'\n        OR LOWER(COALESCE(json_extract_string(raw_json, '$.reg2es.custom.Actions.cmd'), '')) LIKE '%\\programdata\\%'\n        OR LOWER(COALESCE(json_extract_string(raw_json, '$.reg2es.custom.Actions.cmd'), '')) LIKE '%.ps1%'\n        OR LOWER(COALESCE(json_extract_string(raw_json, '$.reg2es.custom.Actions.cmd'), '')) LIKE '%.vbs%'\n        OR LOWER(COALESCE(json_extract_string(raw_json, '$.reg2es.custom.Actions.cmd'), '')) LIKE '%.bat%'\n        OR LOWER(COALESCE(json_extract_string(raw_json, '$.reg2es.custom.Actions.cmd'), '')) LIKE '%powershell%'\n        OR LOWER(COALESCE(json_extract_string(raw_json, '$.reg2es.custom.Actions.cmd'), '')) LIKE '%certutil%'\n    )\n"
finding:
  title: "Scheduled-task command: {task_path}"
  summary: "The Registry parser reported task {task_path} under {key_path}; its command matched one of the queried path or script strings. This cached configuration does not establish that the task ran or was unwanted."
