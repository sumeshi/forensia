id: prefetch-finding-antiforensic-tools
title: "Prefetch execution record for a listed utility"
severity: "medium"
confidence: 0.7
required_fields:
- executable_name
- last_exec_time
tags:
- prefetch
- execution
query: "SELECT evidence_id, executable_name, last_exec_time, exec_count, source_file FROM prefetch_executions WHERE ({{catalog_exe_sql:antiforensic_tools:executable_name}}) ORDER BY last_exec_time DESC"
finding:
  title: "Prefetch execution record: {executable_name}"
  summary: "Prefetch records execution history for {executable_name} (last run: {last_exec_time}, count: {exec_count}). A utility name alone does not establish file wiping or evidence removal."
