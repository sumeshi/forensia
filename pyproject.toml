[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forensia"
version = "0.2.2"
description = "Your local AI assistant for weekend forensic work."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "S.Nakano" }]
keywords = ["dfir", "forensics", "incident-response", "windows", "evtx", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "duckdb==1.5.3",
    "evtx2es==1.12.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "mft2es==1.10.0",
    "prefetch2es==2.6.0",
    "reg2es==2.3.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "sqlglot==30.11.0",
    "typer==0.26.7",
    "textual==8.2.8",
]

[project.scripts]
forensia = "forensia.cli.app:app"

[project.urls]
Homepage = "https://github.com/sumeshi/forensia"
Repository = "https://github.com/sumeshi/forensia"
Issues = "https://github.com/sumeshi/forensia/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forensia = [
    "data/render/*.j2",
    "data/render/partials/*.j2",
    "data/report/*.md",
    "data/report/_formats/*.yaml",
    "data/rules/*/*.yaml",
    "data/schema/*.yaml",
    "data/playbook/*.md",
    "data/sigma/*.json",
    "data/sigma/*.txt",
]

[dependency-groups]
dev = [
    "pysigma==1.5.1",
    "pysigma-pipeline-sysmon==2.0.0",
    "pysigma-pipeline-windows==2.0.1",
    "pytest>=9.0.3",
    "ruff>=0.15",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# F = pyflakes (undefined names, unused imports/locals, redefinitions)
# I = import sorting, UP = pyupgrade (modernize for the py314 baseline).
# E501 (line-too-long) is owned by `ruff format`; E402 is intentional in
# modules that call load_dotenv()/lazy-import before their top-level imports.
select = ["F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# scripts/ are standalone audit tools, not part of the package import graph.
"scripts/*" = ["E402"]

[tool.uv.sources]
pysigma-pipeline-windows = { git = "https://github.com/SigmaHQ/pySigma-pipeline-windows", rev = "5d7170663e3799e6cafaa2d0847ce30a5489827c" }
